; Prevent Epic/Cinematic UI presets from silently restoring the stock 8,192-page
; VSM pool and 1,024-step heterogeneous volumes on the 10 GB Windows target.
[ShadowQuality@3]
r.Shadow.Virtual.MaxPhysicalPages=2048
r.Shadow.Virtual.ResolutionLodBiasDirectional=0
r.Shadow.Virtual.ResolutionLodBiasDirectionalMoving=0
r.Shadow.Virtual.ResolutionLodBiasLocal=0
r.Shadow.Virtual.ResolutionLodBiasLocalMoving=1

[ShadowQuality@Cine]
r.Shadow.Virtual.MaxPhysicalPages=2048
r.Shadow.Virtual.ResolutionLodBiasDirectional=0
r.Shadow.Virtual.ResolutionLodBiasDirectionalMoving=0
r.Shadow.Virtual.ResolutionLodBiasLocal=0
r.Shadow.Virtual.ResolutionLodBiasLocalMoving=1

[EffectsQuality@3]
r.HeterogeneousVolumes.Allowed=1
r.HeterogeneousVolumes.DownsampleFactor=2
r.HeterogeneousVolumes.MaxStepCount=128
r.HeterogeneousVolumes.Shadows.Resolution=256

[EffectsQuality@Cine]
r.HeterogeneousVolumes.Allowed=1
r.HeterogeneousVolumes.DownsampleFactor=2
r.HeterogeneousVolumes.MaxStepCount=128
r.HeterogeneousVolumes.Shadows.Resolution=256

[ReflectionQuality@2]
r.Lumen.Reflections.Allow=0

[ReflectionQuality@3]
r.Lumen.Reflections.Allow=0

[ReflectionQuality@Cine]
r.Lumen.Reflections.Allow=0
