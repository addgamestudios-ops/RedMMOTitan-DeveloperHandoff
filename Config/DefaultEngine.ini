; --- The Drop / planet MVP: Metal zero-hitch tuning (added 2026-07-05) ---
; PSO (pipeline state object) precaching is the #1 fix for on-demand-compile stutter on Metal.
[SystemSettings]
r.PSOPrecaching=1
r.PSOPrecache.Components=1
r.PSOPrecache.Resources=1
r.PSOPrecache.ProxyMaterial=1
r.PSOPrecache.GlobalComputeShaders=1
; Cap the texture streaming pool against (unified) VRAM so a big loading range can't starve the game.
r.Streaming.LimitPoolSizeToVRAM=1
; Hard GPU-residency ceilings for the Windows 10 GB target. These intentionally
; leave several GB free for frame buffers, editor viewports, Niagara and the OS.
r.Streaming.PoolSize=1536
r.Streaming.MaxTempMemoryAllowed=64
r.Shadow.Virtual.MaxPhysicalPages=2048
r.Nanite.Streaming.StreamingPoolSize=512
r.SparseVolumeTexture.Streaming.ReservedResourcesMemoryLimit=512
r.HeterogeneousVolumes.DownsampleFactor=2
r.HeterogeneousVolumes.MaxStepCount=128
r.HeterogeneousVolumes.Shadows.Resolution=256
r.HeterogeneousVolumes.MaxTraceDistance=2000000
r.HeterogeneousVolumes.MaxShadowTraceDistance=800000
r.VolumetricCloud.ViewRaySampleMaxCount=64
r.VolumetricCloud.Shadow.ViewRaySampleMaxCount=32
r.ReflectionMethod=2
r.Lumen.Reflections.Allow=0
r.ScreenPercentage.MaxResolution=1440
t.MaxFPS=60
; Open-world streaming: don't force a full GC on every cell unload (avoids periodic multi-frame stalls);
; spread purges incrementally instead. Monitor memory on the M4 Max unified pool.
s.ForceGCAfterLevelStreamedOut=0
s.ContinuouslyIncrementalGCWhileLevelsPendingPurge=1
; --- Fortnite-stylized perf pass (measured live in PIE at the volcano, 2026-07-06) ---
; Software Lumen on Metal was the #1 GPU hog (~4.6ms) AND caused the gloomy GI murk.
; Killing it: GPU 22.5->16.2ms (~35->47fps) and BRIGHTENS the scene. SSR keeps cheap shine.
r.DynamicGlobalIlluminationMethod=0
r.ReflectionMethod=2
r.Lumen.DiffuseIndirect.Allow=0
; Volumetric fog (~1.7ms) = the dark volcanic haze overhead. Off = de-gloom + perf.
r.VolumetricFog=0
; The legacy HLOD disable is now Mac-only in ARedGameMode::BeginPlay. Windows keeps HLOD enabled;
; here — applying those in [SystemSettings] runs during engine init before the WorldPartition module
; registers the cvar and SIGSEGVs ConsoleManager. Runtime console command is safe + map-scoped.

[DevOptions.Shaders]
; The 16-thread i9 previously launched eight ShaderCompileWorkers. Four keeps
; compile progress useful without consuming the last several GB of system RAM.
ShaderCompilerCoreCountThreshold=12
PercentageUnusedShaderCompilingThreads=75
NumUnusedShaderCompilingThreads=8
NumUnusedShaderCompilingThreadsDuringGame=12
MaxShaderJobBatchSize=5

