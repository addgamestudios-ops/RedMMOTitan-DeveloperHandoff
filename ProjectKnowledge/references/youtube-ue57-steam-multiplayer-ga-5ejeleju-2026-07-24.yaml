    summary: >-
      The tutorial starts a new UE 5.7-or-newer project, adds the third-party
      Advanced Sessions binaries, creates a C++ class, enables Steam-related
      plugins, uses App ID 480 and a pasted Engine.ini block, replaces the game
      instance with Advanced Friends Game Instance, verifies Steam from
      Standalone or a build, and begins a menu/lobby UI. It is useful as an
      introductory listen-session checklist but is not a dedicated-server,
      persistence, scale, security, deployment, or MMO-server design.
