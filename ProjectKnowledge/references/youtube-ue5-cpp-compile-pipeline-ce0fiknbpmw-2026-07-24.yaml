      - claim: Live Coding patches compiled binaries into a running editor and has constructor or default-value caveats
        url: https://dev.epicgames.com/documentation/en-us/unreal-engine/using-live-coding-to-recompile-unreal-engine-applications-at-runtime
        status: corroborated
    local_ue_5_8_corroboration:
