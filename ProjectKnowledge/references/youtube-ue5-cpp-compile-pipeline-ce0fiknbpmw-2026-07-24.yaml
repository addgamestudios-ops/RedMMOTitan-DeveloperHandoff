      - path: D:/RedMMOTitanWindowsData/Diagnostics/M09_DEF0004_UltrawideInventory_20260723_202937Z/build_isolated_inventory_captures.log
        supports: retained TitanEditor evidence explicitly records compile, link, metadata, and Result Succeeded stages
    bounded_adoption:
      - keep the existing package macro-phase detector for BuildCookRun
      - consider a separate compile-only stage classifier only if it covers target setup, UHT, compile, link, metadata, success, failure, and resource abort without duplicating the package classifier
      - a future compile-only wrapper should use one lock, editor-closed targets, NoUBTMakefiles, NoUBA, and MaxParallelActions 1 under existing process and resource gates
      - the current RedHUD header and source changes require a serialized current-source build; Live Coding cannot satisfy M09 target-currency or runtime acceptance
    unsafe_if_copied_without_redmmo_adaptation:
      - diagnosing only the final red log line instead of the first error in the owning stage
      - adding a C++ include instead of declaring the required module dependency
      - treating UHT, one object file, or one DLL patch as a successful current target
      - using Live Coding as proof for reflected layouts, constructors, defaults, plugins, modules, target linkage, receipts, or package currency
      - trusting cached UBT makefiles when newly added source may be omitted
      - launching an external build while Unreal, Live Coding, UBT, UAT, cook, package, or another continuation is active
      - bypassing RedMMOTitan RAM, commit-headroom, single-worker, target-currency, rollback, or protected-checkpoint guards

