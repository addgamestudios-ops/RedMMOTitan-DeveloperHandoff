    summary: >-
      Diagnose Unreal C++ work by the stage that owns the failure: target and
      plugin resolution, UHT reflection generation, native compilation,
      linking, metadata and artifact publication, then module loading. Use Live
      Coding only for bounded runtime patching and retain full editor-closed
      builds for durable target currency and structural changes.
    applicable_patterns:
      - distinguish target or plugin resolution, UHT, compile, link, metadata, load, and runtime-patch failures
      - declare module dependencies in Build.cs rather than trying to repair missing linkage with an include
      - retain the exact target, platform, configuration, command, exit code, first owning-stage error, log, receipt, and linked products
      - use an editor-closed serialized build after header, reflection, module, plugin, constructor, or default-object changes
      - require artifact and log evidence instead of treating an explanation or one successful translation unit as target success
    official_corroboration:
      - claim: UBT manages targets, modules, toolchains, and build actions
        url: https://dev.epicgames.com/documentation/en-us/unreal-engine/unreal-build-tool-in-unreal-engine
        status: corroborated
      - claim: UBT invokes UHT to generate UObject-supporting code before native compilation
        url: https://dev.epicgames.com/documentation/en-us/unreal-engine/unreal-header-tool-for-unreal-engine
        status: corroborated
      - claim: Target.cs selects a target type and target rules
        url: https://dev.epicgames.com/documentation/en-us/unreal-engine/unreal-engine-build-tool-target-reference
