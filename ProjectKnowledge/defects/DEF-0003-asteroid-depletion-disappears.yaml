source_implementation_static:
  verified_safeguards:
    - mining mutation is authority-gated
    - extracted ore is bounded by remaining ore
    - OreRemaining is replicated and forces a net update after mining
    - Active, Depleting, and Depleted plus timestamp, duration, sequence, and reward state replicate as one payload
    - zero ore disables collision immediately while the intact mesh remains visible for a bounded default two seconds
    - sequence guards make the authority transition and reward handoff one-way and idempotent
    - after the intact transition, a finite-relevancy replicated explosion actor creates local cosmetic Chaos debris and suppresses stale late-join replay
    - generated field members receive an authority-initialized immutable replicated stable ID before FinishSpawningActor
    - direct server inventory credit replicates the resource totals and refreshes the HUD
    - a short noncollectible replicated receipt or authority-collected fallback supplies reward feedback
    - the direct-credit receipt routes one installed cue only to the locally controlled mining instigator
    - each replicated explosion actor routes one installed spatial destruction cue on both peers
    - the asteroid is retained hidden after Depleted for live-session late join
    - a Depleted-only relevancy fallback retains that hidden collision-disabled terminal proxy within the existing 50 km network distance without making it globally relevant
  exact_rollback: D:/RedMMOTitanWindowsData/Rollback/BeforeDEF0003Depletion_20260722_1241
  offline_contract_tests_passed: 29
  status_reason: >-
    The missing source contracts are implemented and statically guarded. Both
    current targets link, and one bounded production-map D3D12 run now accepts
    the authoritative local zero-ore transition, immediate collision shutdown,
    readable intact delay, post-delay explosion and debris, exactly-once local
    reward, and visible replacement-HUD tally. A separate rendered two-client
    PIE run accepts same-frame final-hit idempotence, exactly one remote reward,
    remote phase, collision, receipt, inventory, and replacement-HUD parity,
    plus replicated explosion and debris runtime state. A third rendered
    standalone slice authenticates and depletes one actual generated
    deep-space-field member by immutable stable ID while preserving its
    twenty-three peers and delivering the visible reward tally. A fourth
    rendered listen-server plus Client 1 slice proves reciprocal near/far
    presentation behavior for that actual member without overriding the
    production cutoff. A fifth rendered listen-server plus Client 1 slice
    depletes that stable-ID member, awards the remote player exactly once,
    matches replicated phase, receipt, inventory, and full replacement-HUD
    text, and preserves the other twenty-three field members. A sixth rendered
    pass directly reads Client 1 viewport pixels and accepts the remote
    red-white flash, hot and gray debris pieces, debris motion, and flash decay
    while preserving those replication and reward gates. A seventh rendered
    multiplayer slice first reproduces the hidden Depleted proxy late-join
    failure, then accepts four true-late-client timings after a narrow
    Depleted-only 50 km relevancy repair. An eighth rendered two-client
    automation slice proves exact installed reward and explosion cue routing,
    separate unmuted PIE audio devices, and non-silent Client 1 master output
    during the same passing reward, HUD, flash, and debris gates. A ninth
    rendered two-client automation slice proves an owning Client 1 autonomous
    proxy invoked the production reliable NetServer ServerFire RPC, authority
    delivered a replicated ARedBolt, and actual member 23 replicated exactly
    from 6000 to 5820 ore on both peers after its 180-ore hit. A tenth rendered
    two-client slice through the official UE 5.8 MCP accepts the current transient presentation:
    only the remote mining owner receives exact IRON +6, the host receives no
    credit or receipt, replicated inventory matches, the permanent tally stays
    absent, and the receipt expires while the unit-scale non-voxel target stays
    at 53.4 km and all twenty-four production members remain pristine. DEF-0003 remains
    open for simultaneous client-originated final-hit arrival if required and
    explicit restart persistence or respawn semantics.
  durability_limit: >-
    Depleted is durable for the live actor session only. BeginPlay initializes a
    fresh actor, so server-restart persistence and an explicit respawn policy are
    not implemented or claimed.

