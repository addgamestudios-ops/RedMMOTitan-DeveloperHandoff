schema_version: 1
id: DEF-0004
title: Pixel-exact HUD is a static composite rather than a functional HUD
status: open
severity: major
found_utc: "2026-07-21"
owner_domain: ui_hud

affected:
  runtime_class: URedHUDWidget
  default_mode: live_data_current_source_editor_built
  texture_asset_path: /Game/UI/RedHUD/Textures/ExactLayoutSprites/T_REDHUD_FullComposite_Exact

observed: >-
  Historical July 21 observation: the supplied artwork rendered pixel-exactly as
  one hit-test-invisible full-screen image, with baked values and no control hit
  regions, while RedMMO did not activate or feed live-data mode. Current source
  partially supersedes that observation as recorded below; the defect remains
  open for the still-unreachable and unverified functional scope.

expected: >-
  The supplied images should form a visually faithful live HUD whose values
  update from gameplay, whose represented controls work without dead ends, and
  whose individual elements can be moved, resized, hidden, locked, and assigned
  independent opacity with persistent settings.

impact:
  blocked_claims:
    - pixel_exact_hud_functional
    - pixel_exact_hud_live_data
    - pixel_exact_hud_no_dead_ends
    - pixel_exact_hud_per_element_customization

