schema_version: 1
id: DEF-0008
title: Depletion audit asteroid appears as a giant boulder inside the atmosphere
status: resolved
severity: major
found_utc: "2026-07-23"
resolved_utc: "2026-07-23T13:17:43Z"
owner_domain: space_mining_presentation

affected:
  map_asset_path: /Game/RedMMO/Maps/RedPlanetGen
  runtime_class: ARedMineableAsteroid
  harness_flag: RedDEF0003DepletionAutoCapture

observed: >-
  The one-client depletion visual harness spawns its transient mineable
  asteroid only 120 metres above the surface player and frames it at close
  range. The resulting evidence looks like an enormous boulder suspended in
  the blue atmosphere and can be mistaken for production asteroid placement.

expected: >-
  Asteroid mining and its acceptance evidence should occur outside the
  atmosphere at a credible space scale and viewing distance. A surface player
  should not see a giant mineable boulder hanging in atmospheric flight space.

root_cause:
  production_type: static_mesh_not_voxel
  exact_harness_offset_cm: 12000
  atmosphere_height_cm: 800000
  production_field_inner_altitude_cm: 3840000
  production_field_outer_altitude_cm: 6840000
  production_render_cull_distance_cm: 2000000
  finding: >-
    The visible atmospheric rock is the transient non-Shipping audit actor, not
    a member of the canonical twenty-four-asteroid production deep-space field.
    The production field's configured altitude shell starts beyond atmosphere
    plus render-distance and clearance guards.

evidence:
  user_screenshot: D:/RedMMOTitanWindowsData/UserTemp/codex-clipboard-05422b1b-bbfe-4570-a95d-3a1c8fb05aa1.png
  reproduced_before: D:/RedMMOTitanWindowsData/Diagnostics/HUD_MiningResult_RealGPU_Final_20260723_154715/Captures/DEF0003_Before.png
