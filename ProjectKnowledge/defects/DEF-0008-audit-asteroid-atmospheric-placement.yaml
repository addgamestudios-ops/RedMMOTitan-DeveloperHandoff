  production_field_spec: ProjectKnowledge/systems/asteroid-field.red-mars-deep-space.yaml
  accepted_after: ProjectKnowledge/evidence/2026-07-23-def-0008-deep-space-harness-real-gpu.yaml

impact:
  resolved_claim:
    - bounded_non_shipping_surface_absence_and_deep_space_mining_presentation
  still_out_of_scope:
    - warning_free_full_production_field_space_mining_visual_polish
    - player_controlled_surface_to_space_asteroid_travel

resolution: >-
  The non-Shipping harness now captures a clean surface frame before any audit
  asteroid exists, then places one transient production-class static-mesh
  target at 53.400 km altitude with its production twenty-kilometre render
  cull. The camera remains in deep space at 53.409 km altitude and frames the
  mesh at an 11.42-degree angular diameter. The atmospheric 120-metre spawn and
  unlimited-cull override were removed.

acceptance_results:
  - surface camera altitude 0.502 km is inside the 8.000 km atmosphere and the frame contains zero audit asteroids
  - all twenty-four production members remain between their configured shell guards and at least 43.699 km from the surface camera
  - the accepted target is SM_Mining_Asteroid_Med, a static mesh with voxel=0
  - deep-space depletion produces one reward, one explosion, nine debris pieces, and an expiring IRON +6 receipt
  - all twenty-four production members finish Active, full, and unaffected
  - forty-seven focused contracts, TitanEditor compilation, and one clean RTX 3080 D3D12 run pass

acceptance_to_close:
  - no mineable asteroid is visible as a giant atmospheric boulder from the surface
  - the acceptance target is beyond the configured atmosphere guard
  - the target remains mineable and readable at a credible space distance
  - production field identity, altitude shell, scale, render cull, and peer count remain unchanged
  - pass current source contracts and TitanEditor build
  - pass real-GPU surface-absence and space-mining visual review

claim_limit: >-
  DEF-0008 is closed only for the bounded non-Shipping one-client acceptance
  harness. The evidence does not implement voxel asteroids, prove
  player-controlled surface-to-space travel, or satisfy packaged, Steam,
  dedicated-server, or multiplayer acceptance.
