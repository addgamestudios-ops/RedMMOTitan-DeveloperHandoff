id: DEF-0002
title: Fighter can settle nose-down and remain immobilized after reboarding
status: open
severity: critical
found_utc: "2026-07-21"
owner_domain: vehicle_gravity_and_landing

affected:
  map_asset_path: /Game/RedMMO/Maps/RedPlanetGen
  vehicle_class: ARedShip
  navigation_ui: compass

observed: >-
  After returning from space, the fighter settled nose-first into the sand. The
  player could exit and reboard, but the fighter could no longer fly and the
  compass heading rotated continuously.

expected: >-
  A crash landing may be rough, but reboarding must restore a valid dominant
  gravity body, radial up vector, flight state, control authority, and stable
  compass heading so the craft can take off.

impact:
  blocked_claims: [fighter_landing_accepted, fighter_reboard_accepted, gravity_transition_accepted]

