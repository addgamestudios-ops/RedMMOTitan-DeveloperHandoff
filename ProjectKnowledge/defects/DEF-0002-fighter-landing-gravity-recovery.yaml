current_source_reconciliation:
  verified_existing_safeguards:
    - dominant gravity body selection refreshes before the local-controller early return
    - exit and reboard clear stale local, server, boost, movement, and velocity state
    - exact owned-terrain parking and landing use the dominant body's radial-up frame
    - local and server W or positive-lift input can release a settled landing lock
    - ship compass heading uses a spherical tangent frame and caches its last-valid fallback with the movement component's existing stable gravity-body ID
    - the compass invalidates that cache on body change, NAME_None, missing movement, or a non-ship HUD reference and reuses it only when nonempty stable IDs match
    - an explicit read-only snapshot compares cached and queried stable body IDs, centers, radii, and radial-up vectors without mutating flight state
    - the snapshot optionally requires settled ship-up alignment and reports role, net mode, authority, landing-assist, settled state, and explicit failure reasons
    - landing alignment, settled repin, unpossessed descent, touchdown, and normal parking commit through one reversible fitted-envelope endpoint transaction
    - the transaction analytically composes the target fitted box, checks native fitted/root and exact matching-PlanetGen endpoint clearance, verifies the target pose, and reverts on any failed postcondition
    - rejected normal exit preserves pilot, possession, transform, velocity, input, fire, and boost state; failed placement removes only inward radial velocity
    - the transaction now preflights the complete native sphere route and either the fixed-rotation fitted-box native/exact route or conservative two-degree fitted-box screw-motion segments before committing
    - route input is bounded to 100 m and ninety segments, preserves the scaled fitted-envelope offset and live collision response mask, and fails closed before mutation
    - BeginPlay no longer directly teleports the ship root; only authority with movement and a configured fitted hull attempts the existing bounded reversible transaction after planet-frame assignment
    - BeginPlay requests immediate replication only after transaction success; unavailable prerequisites or a rejected route/postcheck preserve the pose and log without a raw fallback
    - ClampToPlanetSurface no longer contains its three raw root corrections; eligible exact-terrain penetration or legacy-void correction delegates to one authority-owned bounded fitted-envelope transaction
    - exact recovery binds the caller's PlanetGen line witness to component and chunk identity, accepts only clean-behind-shell or matching start-penetration initial state, and requires native plus reciprocal exact route provenance
    - authored crater descent, matching PlanetGen NoHit deferral, rejection-only inward-velocity containment, endpoint postchecks, and scoped rollback are structurally enforced
  critical_open_gaps:
    - passive fitted-envelope recovery is intentionally disabled
    - the route preflight is source-verified but not freshly compiled or executed; active matching-PlanetGen coverage, conservative false rejects, and worst-case one-frame query cost remain unproved
    - normal surface parking above the 100 m local bound fails closed unless an established orbital or emergency path applies
    - native fitted-box and rotation-changing initial-overlap recovery remain fail-closed
    - the Clamp surface-recovery safeguard is uncompiled and unexecuted; Chaos start-overlap, reciprocal normals, endpoint clearance, rollback, repeated-call cost, seam behavior, and authority replication remain unproved
    - strict same-component and same-chunk provenance can conservatively reject valid recovery near active-chunk or cube-face seams, while reciprocal nearest-hit sweeps cannot prove exactly one terrain crossing
    - the 100 m bound cannot recover every possible deep fall beneath terrain whose authored displacement exceeds that local distance
    - BeginPlay has no deferred recovery retry if its fitted hull becomes ready after the one initial attempt
    - the new telemetry has not passed runtime console or Blueprint invocation
    - the body-keyed compass safeguard lacks current nose-radial reboard runtime evidence
