  status_reason: >-
    Current source is newer than the reproducing playtest and contains meaningful
    recovery safeguards, a body-keyed compass fallback, and explicit read-only
    gravity-frame telemetry. Reversible endpoint clearance now covers landing and
    normal parking. A newer bounded source route preflight covers complete native
    sphere translation plus fixed or rotating fitted-box corridors before one
    atomic commit, but it is not included in the prior translation-unit or full
    target build evidence. BeginPlay now delegates its one eligible authority
    correction to that same fail-closed transaction only when the fitted hull is
    ready; it no longer has a direct transform fallback. ClampToPlanetSurface
    now delegates eligible exact-terrain penetration and legacy-void correction
    to one authority-owned bounded fitted-envelope transaction, without its
    three prior raw root writes. The Clamp path is uncompiled and unexecuted;
    strict component/chunk provenance may conservatively reject seams, and
    Chaos start-overlap, reciprocal normals, endpoint rollback, repeated-call
    cost, authority replication, broader fitted-hull hard-lock recovery,
    runtime, and real-GPU evidence remain open. Build/static evidence cannot
    satisfy this gameplay defect.

acceptance_to_close:
  - reproduce planet approach, landing, exit, reboard, and takeoff on a real GPU
  - compile and invoke gravity acceptance snapshots to log dominant gravity body and radial up agreement before landing and after reboard, requiring frame pass and settled alignment where applicable
  - prove the ship cannot remain hard-locked nose-down after a recoverable landing
  - compile and execute the bounded route preflight and prove landing and parking cannot cross native or matching-PlanetGen blockers
  - prove compass yaw remains stable while stationary and follows the active body frame
