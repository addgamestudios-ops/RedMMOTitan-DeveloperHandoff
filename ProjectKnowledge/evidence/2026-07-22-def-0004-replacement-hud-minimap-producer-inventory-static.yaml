    - projects raw forward/right components and drops the third dimension
    - recalculates heading from world Euler yaw instead of the stable planet-tangent heading
    - invalid world or reference actor returns without clearing old markers or nearest-contact text
    - distant contacts pin to the rim rather than following an accepted sensor contract

