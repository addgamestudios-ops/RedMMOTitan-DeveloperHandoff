implemented_contract:
  identity_source:
    - the compass reads URedShipMovementComponent::GetCurrentGravityBodyId through the existing const getter
    - it does not query, select, reprioritize, or mutate a gravity body
  invalidation:
    - NAME_None or a stable ID different from the cached ID clears cache validity and cached body identity before tangent evaluation
    - a non-ship HUD reference also clears cache validity and cached body identity
  cache_write:
    - a non-degenerate tangent heading is cached only when the current stable body ID is nonempty
    - heading and body identity are written together before the cache becomes valid
  cache_read:
    - degenerate tangent fallback requires a valid cache, a nonempty current ID, and exact cached/current ID equality
    - a heading from body A therefore cannot be reused on body B
  mutation_boundary: >-
    Only local compass presentation cache state changed. Gravity, transforms,
    velocity, collision, input, landing, parking, HUD layout/art, and replication
    are untouched.

