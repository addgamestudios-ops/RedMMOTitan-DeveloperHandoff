root_cause_and_repair:
  prior_uht_error: >-
    UE 5.8 rejected uint32 Sequence because BlueprintReadOnly made that inner
    reflected field Blueprint-visible even though uint32 is not a supported
    Blueprint member type.
  repair: >-
    Kept Sequence as the reflected unsigned revision used by replication,
    two one-way increments, timer propagation, stale-callback rejection, and
    percent-u logging. Removed BlueprintReadOnly only from the inner Sequence
    UPROPERTY; VisibleInstanceOnly remains. The outer replicated
    FRedMineableAsteroidDepletionState remains BlueprintReadOnly.
  blueprint_dependency_audit: >-
    Source and Content searches found no Blueprint or external consumer of the
    inner Sequence field. Its consumers are C++ timer and idempotence paths.
  behavior_change: none

