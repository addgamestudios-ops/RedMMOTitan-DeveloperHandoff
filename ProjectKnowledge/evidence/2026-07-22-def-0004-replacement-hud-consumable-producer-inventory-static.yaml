        Resource pickups and depleted mineable asteroids call AddResource, which
        feeds the legacy SetResourceTally path; they were not reinterpreted.
    - item: player fuel and weapon heat
      disposition: >-
        Fuel is a continuous movement/vitals value and weapons use continuous
        heat/overheat state rather than ammunition or consumable stacks.
    - item: ARedMineableAsteroid and ARedOrbitalMiningSite OreRemaining
      disposition: >-
        These values are world mining reserves. The replicated asteroid can
        award Stone/Iron/Crystal through AddResource; neither publishes a
        per-player consumable slot.
    - item: FVibeMMOInventoryItemPresentation and UVibeMMOInventoryWidget
      disposition: >-
        Transient UI presentation/filter state has no quantity, stack, use,
