evaluation:
  selected_bounded_contract:
    - request FILE_WRITE_THROUGH for the exclusive staging file and any native-relative child directory created by the report path
    - retain the existing explicit pre-rename file flush and full native identity validation
    - retain the parent-relative flags-zero no-replace rename
    - explicitly flush the same still-open writable file handle after rename and before final validation and commit
    - propagate post-rename flush failure through the existing exact-handle cleanup path
  intentionally_not_integrated:
    - directory-handle flushing because public portable directory durability semantics are not established by this bounded evidence
    - active-volume flushing because it is broader than this report publication, may require elevated rights, and can affect unrelated open files
  local_directory_characterization:
