scope:
  objective: >-
    Build a minimal project-owned local Model Context Protocol bridge for
    Character Creator 5.11 that keeps every RLPy call inside CC5, exposes no
    arbitrary execution or network surface, and supports inspection, exact
    allowlisted character shaping, and explicit non-overwriting project
    version snapshots.
  performed:
    - inspect the installed CC5 5.11 host, embedded Python 3.8 RLPy API, plugin loading convention, shaping API, timer and event callbacks, and SaveProject signature
    - implement a Python 3.8-compatible in-CC5 RLPy plugin with timer-polled authenticated filesystem IPC
    - implement a separate Python 3.10+ FastMCP stdio server with five exact tools
    - bind every morph mutation to the inspected plugin instance, project epoch and selected RIObject ID
    - bind project version snapshots to the inspected project-session identity
    - publish snapshots through private staging and Windows no-replace MoveFileExW with size, SHA-256 and rename-identity verification
    - fail closed on non-NTFS storage, reparse points, a non-private DACL, unexpected owner, config hard links, missing runtime directories and broad local principals
    - throttle durable status publication and ACL scans to a one-second heartbeat while retaining full validation immediately before operations
    - document reviewed private-ACL installation, dependency, plugin copy, launch and Caricature Mixer allowlisting steps
    - run independent security review through correction and final zero-P0-through-P2 verdict
  not_performed:
    - install mcp 1.28.1 or another dependency
    - copy or activate the plugin in the CC5 installation
    - create the private runtime config, token, queue or saved-project directories
    - change Codex MCP configuration
    - call RLPy, select or modify a character, enumerate live morph IDs, or save a CC project
    - control, restart or close the already-running CC5 process
    - launch Unreal, build, cook, package, import, migrate, modify a map, or touch a protected game asset
    - claim live CC5, Caricature Mixer, morph, save, visual, gameplay or real-GPU acceptance

