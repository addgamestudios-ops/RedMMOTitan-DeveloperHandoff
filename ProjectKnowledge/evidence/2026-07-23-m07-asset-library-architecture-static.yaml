    publisher: Unreal Engine
    presenter_context: Unknown Worlds, Subnautica 2
    reviewed_from: visible English auto-generated transcript and official description
    applicable_lessons:
      - prefer engine systems and extend stable seams before building a replacement platform
      - placement and rule results must be previewable in the editor
      - use World Partition, One File Per Actor, bounded builder processing, and Data Layers at scale
