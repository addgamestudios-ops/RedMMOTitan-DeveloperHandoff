producer_inventory:
  result: zero_trustworthy_authoritative_or_owner_replicated_party_producer_found
  redmmo:
    - no PartyId, PartyMembers, SquadId, replicated roster, mutation RPC, or custom PlayerState or GameState owner was found in compiled project source
    - bIsEnemy is an enemy-clone marker and cannot identify party membership
    - GetExplicitGrappleTeam is an optional future friendly-fire check that falls back to NoTeam; ARedPlayerCharacter does not implement the generic team interface
  sessions_and_friends:
    - FRedSessionResultSummary contains host identity plus aggregate current and maximum player counts, not member identities
    - CurrentPlayers is capacity minus open public connections, not a roster
    - InviteSteamFriends opens the external Steam invite UI and does not publish membership
    - no project IOnlineFriends, registered-player, or SteamIntegrationKit party call feeds RedHUD
  steam_vendor_boundary:
    - SIK party functions expose generic Steam party-beacon operations, not the required replicated RED member state or vitals
    - the bundled OnlineSubsystemSteam returns nullptr from GetGroupsInterface and GetPartyInterface
    - project RedMMO, RedHUD, and Vibe compiled sources have zero SIK party, Steam party-interface, join-party, or beacon call sites
  vibe:
    - PartyPanel is a local layout identity only
    - saved offset, scale, opacity, locked, and hidden fields are presentation preferences, not gameplay membership
  bounded_content_filename_inventory:
    roots: [Content/RedMMO, Content/UI]
    files_scanned: 129
    matching_files:
      - Content/UI/RedHUD/Textures/ExactLayoutSprites/T_REDHUD_PartyList_Exact.uasset
      - Content/UI/RedHUD/Textures/HighResSprites/T_REDHUD_PartyList.uasset
      - Content/UI/RedHUD/Textures/IndividualSprites/T_REDHUD_PartyRow_01.uasset
      - Content/UI/RedHUD/Textures/IndividualSprites/T_REDHUD_PartyRow_02.uasset
      - Content/UI/RedHUD/Textures/IndividualSprites/T_REDHUD_PartyRow_03.uasset
    disposition: supplied_art_not_gameplay_state
  serialized_boundary:
    - Blueprint graphs and serialized package payloads were not decoded
    - filenames reveal no party gameplay model, but static inspection cannot prove opaque graphs contain none
    - even an opaque producer would remain unaccepted because RedHUD has no dedicated safe party consumer contract
  disposition: do_not_wire_or_fabricate_party_state

source_hardening:
  helper: IsDormantPartyArtName
  known_compiled_visibility_paths_guarded:
    - SetLiveDataMode excludes PartyRow01, PartyRow02, and PartyRow03 when enabling live art
    - SetElementVisible refuses to re-show those three baked rows
    - ApplyHUDLayout re-applies SetLiveDataMode before element transforms and cannot re-show a non-hidden dormant row
  preserved:
    - all three supplied art assets and authored layout rectangles
    - PartyPanel layout customization identity for a future real consumer
    - every existing granular gameplay feed
  not_added:
    - party setter
    - party snapshot field
    - guessed session, friend, enemy, or generic-team bridge

required_future_party_contract:
  before_any_live_consumer_or_bridge:
    - server-owned stable party ID
    - stable member IDs, leader or role, and authenticated local ownership
    - owner-authorized replicated membership and presentation-safe member state
    - monotonic revision with stale and out-of-order rejection
    - explicit presence, clear, join, leave, kick, leader-transfer, disconnect, reconnect, travel, death, respawn, and late-join semantics
    - deterministic three-row mapping, overflow policy, and clearing of every unused row
    - opponent-information isolation
    - gameplay party persistence kept separate from local HUD-layout persistence

