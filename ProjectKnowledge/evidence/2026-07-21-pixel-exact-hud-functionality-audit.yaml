claim_limit: >-
  This is a source audit, not a compile or real-GPU interaction test. It proves
  the current exact-art architecture is a static, hit-test-invisible composite
  and identifies the separate native menu bindings. It does not prove that the
  separate pause menu works in the current uncompiled source or that any future
  componentized pixel-exact HUD will match the supplied art.

acceptance_needed:
  - rebuild the supplied HUD as exact per-element art, not a single interactive-looking bitmap
  - bind live gameplay data for vitals, heat, weapons, abilities, party, quest, and minimap
  - add real hit regions and handlers for every control represented as interactive
  - preserve the supplied pixels at the target reference resolution
  - support independent move, scale, opacity, visibility, lock, and persistence per HUD element
  - run source binding tests, a clean compile, and a real-GPU mouse/controller interaction pass
