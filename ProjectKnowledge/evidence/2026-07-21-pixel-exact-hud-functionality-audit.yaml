scope: supplied_pixel_exact_hud_interactivity_and_live_data

result:
  exact_art_visual_state: accepted_by_prior_real_gpu_gate
  exact_art_interactivity_gate: fail
  exact_art_live_data_gate: fail
  exact_art_per_element_customization_gate: fail
  separate_pause_menu_native_bindings: present_not_pixel_exact

findings:
  - >-
    RedHUD BeginPlay explicitly selects SetLiveDataMode(false), so the default
    supplied-art presentation is ExactArt rather than the live component mode.
  - >-
    ExactArt renders one supplied T_REDHUD_FullComposite_Exact image and collapses
    every component sprite and live widget. The composite therefore retains its
    baked sample values rather than receiving live health, weapon, ability,
    minimap, party, quest, heat, or cooldown data.
  - >-
    RedHUDRuntime contains no UButton, OnClicked, mouse-handler, or hit-region
    implementation. The exact-art widget is set HitTestInvisible, so painted
    inventory, skill, settings, utility, and weapon regions are not clickable.
  - >-
    Live snapshot setters exist inside RedHUDRuntime, but no RedMMO gameplay code
    calls ApplySnapshot, SetPlayerVitals, SetWeaponState, SetAbilityState, or
    SetLiveDataMode(true).
  - >-
    Escape, multiplayer, inventory, skills/loadout, settings, and HUD layout
    controls exist in a separate native pause-menu implementation. They do not
    use the supplied pixel-exact HUD art and do not make the painted exact-art
    regions interactive.

