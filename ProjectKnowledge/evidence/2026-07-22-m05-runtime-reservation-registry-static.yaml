implemented:
  - A query-only Blueprint runtime registry exposes the authenticated RED Mars hub-reservation body ID, dataset hash, count, records, and geodesic feature-protection query.
  - All 27 GUIDs are bound to frozen index, seed, archetype, direction, hub radius, protected radius, blend radius, reservation ID, and source-patch rows from the canonical JSON dataset.
  - Every public record/query path rejects the layout if any live deterministic region-service field drifts outside the documented direction or radius tolerance.
  - Each record exposes an immutable namespaced authoring-region ID independent of its archetype/display label.
  - Empty, misspelled, or otherwise unregistered feature tags fail invalid, blocked, and full-weight instead of bypassing a hub.
  - Authenticated records are cached once; point queries do not format names, parse GUIDs, or copy tag arrays inside the per-reservation loop.
  - Two focused Unreal automation tests were authored for exact 27-row C++ output fields and protection-query boundaries but were not compiled or executed under this resource gate.
