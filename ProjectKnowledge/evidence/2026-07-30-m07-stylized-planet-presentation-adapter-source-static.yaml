verified_extension_points:
  active_planetgen_1_4:
    terrain:
      - ACLMPlanet.TerrainMaterial is one material shared by generated chunks
      - vertex colors encode R water, G grass, B rock, and A snow
      - UV1 encodes X beach and Y desert sand
      - the project fork exposes authored RGBA biome weights through the existing macro-surface path
    biomes:
      - climate slots are 0 tundra, 1 boreal, 2 desert, and 3 tropical
      - climate selection affects snow, rock, vegetation density, desert sand, and foliage filtering
      - the internal climate index is retained for foliage but is not a separate public terrain-material slot
    foliage:
      - ACLMPlanet.FoliageAssets accepts UPlanetGenBiomeFoliageAsset mesh and placement records
      - ACLMPlanet.GrassAssets accepts UPlanetGenGrassAsset ground-cover records
      - source supports density, height, slope, scale, jitter, clustering, collision, and climate filters
    water:
      - ACLMPlanet.WaterMaterial is presentation-selectable
      - water geometry and sea datum remain owned by ACLMPlanet and are not adapter inputs
    atmosphere:
      - ACLMPlanetSunSky exposes separate atmosphere, volumetric-cloud, and sun references and kilometre settings
      - the adapter has no atmosphere or cloud fields
    gravity:
      - UPlanetGenGravitySourceComponent and UPlanetGenGravitySubsystem expose logical gravity volumes
      - ACLMPlanet owns an internal gravity source, gated by bProvidePlanetGravity
      - the adapter has no gravity, radius, or movement fields
    multiplayer:
      - UPlanetGenGravityMovementComponent extends saved-move/network-prediction behavior
      - APlanetGenGravityCharacter replicates jetpack state
      - the adapter contains no replication declarations and does not change multiplayer behavior
  inactive_ppg_1_0:
    PlanetData_header_sha256: 99AD104C419E1ADA4DD36804E6D7E6BA2AC47D8F67C5152E83DAAA08A8BDEF41
