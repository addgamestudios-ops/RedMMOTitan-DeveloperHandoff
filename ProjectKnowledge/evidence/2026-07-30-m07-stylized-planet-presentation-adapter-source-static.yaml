    future_hooks:
      - UPlanetData separates visible surface, generation, biome-mask, water, and per-biome foliage assets
      - UFoliageData exposes weighted meshes, density masks, height, slope, clustering, collision, WPO, and LODs
      - APlanetSpawner exposes a volumetric-cloud actor and parameter refresh
