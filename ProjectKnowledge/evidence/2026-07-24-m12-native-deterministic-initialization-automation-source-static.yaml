  bounded_fixture:
    - one canonical deterministic 16-cubed volume with 8-cubed chunks is initialized in exactly two fresh local backend instances
    - every one of the eight chunks begins at revision zero and exposes the same stable ID, coordinate, content hash, and authority generation in both instances
    - no edit, completion, persistence, restore, release, invalidation, journal-capacity, actor, map, or runtime operation enters the scenario
  canonical_checkpoint_identity:
    - both full revision-zero checkpoints contain eight chunks in deterministic order
    - checkpoint manifests, per-chunk canonical payload fingerprints, and canonical RLE bytes match exactly
    - every manifest, payload, and authority content fingerprint is checked for canonical SHA-256 shape
  duplicate_initialization_atomicity:
    - duplicate initialization of the live stable ID returns the exact collision error
    - live revision, authority generation, full checkpoint manifest, all eight checkpoint payloads, and all eight chunk revision identities remain exact
    - the first later build request still receives attempt token one
  detached_build_snapshot:
    - one Presentation request per backend binds the same canonical spec, source revision, role, profile, and density-material bytes
    - each 512-byte detached authority snapshot is rehashed and bound to its matching checkpoint payload fingerprint
    - backend-instance capability GUIDs remain valid and distinct and are excluded from portable deterministic identity
    - queueing cannot advance canonical revision or fabricate Presentation or Collision readiness
  isolation:
    - all five native automation macros and backend-using code remain inside WITH_DEV_AUTOMATION_TESTS
    - every registration is ProductFilter and has one exact automation path
    - no actor, world, map, Inventory, mesh adapter, voxel plugin, Steam, or filesystem adapter is referenced

