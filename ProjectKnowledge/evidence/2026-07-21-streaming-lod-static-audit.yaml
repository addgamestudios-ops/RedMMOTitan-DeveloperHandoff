implemented_foundation:
  nearby_streaming:
    - PlanetGen updates streaming sources at 0.1 second intervals.
    - Player and replicated-player pawns plus optional actors become angular streaming sources.
    - Half-chunk edge coverage, unload hysteresis, movement-threshold rescans, nearest-facing-first loading, and a smaller collision ring are implemented.
    - The 50 km profile uses 2 km tiles, resolution 32, view distance 3, collision distance 1.5, and at most eight chunks per cube face.
  bounded_cost:
    - The streamed chunk pool is globally capped at six times chunks-per-face squared, or 216 actors for the current profile.
    - A collision-free resident macro globe supplies a bounded distant fallback.
  continuity_safeguards:
    - Shared cube-face edge and corner texels are fused deterministically.
    - Detailed chunk normals sample a one-vertex external border.
    - Build-generation tokens reject stale asynchronous uploads after chunk reuse.
  deterministic_metadata:
    - The 27-region metadata service uses a fixed layout seed and stable integer hashing.
    - Existing tests verify 27 unique deterministic region seeds in one process.

unmet_gates:
  nearby_gameplay_detail:
    status: not_accepted
    reason: >-
      Static source proves the mechanism, not the serialized production settings,
      collision readiness, packaged behavior, or player-visible gameplay detail.
  distant_bounded_cost_lod:
    status: not_met_as_written
    reason: >-
      Cost is bounded by a fixed pool and resident proxy, but every detailed
      chunk uses the same mesh resolution. Coarse-to-fine terrain LOD rings,
      proxy/detail crossfade, and altitude-aware detail reduction do not exist.
  flight_without_hitch_or_holes:
    status: not_accepted
    reason: >-
      Old chunks can be recycled before replacements finish, collision changes
      rebuild whole chunks, and there is no newest-generation Chaos cook-ready
      handoff, velocity look-ahead, or explicit generation/cook frame budget.
      Existing tests settle the new ring before traversal or preload all chunks,
      so they do not prove continuous high-speed cross-face flight.
  multiplayer_region_seed_use:
    status: not_accepted
    reason: >-
      Deterministic seed math exists, but no server/client authority path,
      replicated PlanetGen seed, late-join parity, or two-process comparison was
      found. Optional non-pawn streaming sources are editable, not replicated.

