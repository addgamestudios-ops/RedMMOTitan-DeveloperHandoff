    result: >-
      The test reached every acceptance marker, then the duplicate cleanup
      asserted in FUObjectArray::IndexToObject and terminated the editor.
  root_cause_and_recovery: >-
    UE 5.8 FStartPIEForAutomationCommand already removes the rooted
    EditorPlaySettings in its destructor, including abort and teardown paths.
    The duplicate cleanup was reverted byte-exact to the prior harness hash,
    TitanEditor rebuilt, and the final rendered run passed and shut down
    cleanly. The failed intermediate run is not acceptance evidence.

