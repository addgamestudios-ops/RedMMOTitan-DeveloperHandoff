finding: >-
  Installed PPG 1.0 can preserve a deterministic seed while producing larger
  continent-like forms, distinct seeded biomes, smoother broad hills, per-biome
  materials and foliage, and a radial sea-level ocean by editing the supported
  material graphs and their public node controls. It does not expose a named
  one-click continent generator: continent scale is authored through global
  low-frequency elevation and biome masks. Its native water is a constant-radius
  sea surface selected by negative generated elevation, not a hydrology system.
  Rivers, classified lakes, roads or pathways, local build pads and protected
  handcrafted reservations therefore require project-owned deterministic
  extensions and must not be claimed as hidden PPG features.

