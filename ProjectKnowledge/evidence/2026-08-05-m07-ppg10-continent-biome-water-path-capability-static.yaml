verified_controls:
  deterministic_planet:
    - PlanetData exposes PlanetRadius, NoiseHeight and stable GenerationSeed; identical data and seed produce identical terrain
    - GenerationMaterial owns terrain height and vertex colors, BiomeMaskMaterial chooses biome IDs, and PlanetMaterial owns visible biome materials
  continent_and_relief_authoring:
    - Planet Noise exposes FBM, crater, Voronoi, erosion and tectonic modes with BaseFrequency and Octaves
    - FBM RidgePower and extensive erosion strength, scale, detail, ridge rounding, crease rounding, input rounding, octave rounding, onset, lacunarity and gain controls allow lower-frequency broader landforms and less jagged runnable relief when authored deliberately
    - Planet Elevation Output accepts one global height plus one height input per named biome, so continent-scale height and biome-specific relief can be composed in the deterministic generation material
  seeded_biomes:
    - Planet Biome Mask Output supports one to sixteen named masks
    - BiomeCellResolution controls the number of Voronoi cells per cube-face edge and BiomeCellSeed fixes the layout
    - BiomeTransition, material-height blend smoothness, Voronoi warp strength and warp scale control seeded boundary shape and blending
    - PlanetData stores per-biome foliage assets and PlanetSpawner exposes a minimum biome-blend strength for foliage eligibility
  water_and_shoreline:
    - PlanetData owns native water enable, near and far water materials, simulation data and tessellation settings
    - visible water is generated only for generated terrain chunks whose minimum normalized elevation is below zero
    - water vertices lie on the constant PlanetRadius sphere, so terrain generation and seed determine where coast or below-sea-level basin coverage appears
    - Planet Flatten Elevation smooths elevation only near the global water level through WaterLevel and Threshold

