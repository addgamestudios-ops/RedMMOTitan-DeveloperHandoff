verified_existing_source_contracts:
  - dominant gravity body selection refreshes before the local-controller early return and retains stable-ID hysteresis
  - exit clears local, server, boost, movement-component, and velocity latches before surface parking
  - parking and landing query exact owned PlanetGen terrain and use the dominant body's radial-up frame
  - fitted support distance, tangent-forward reconstruction, and zero-velocity touchdown are present
  - reboard clears stale flight state before possession and explicitly restores move and look input
  - local W or positive lift and the server input mirror release a settled landing lock
  - ship compass heading uses a spherical tangent frame and the last stable heading fallback

critical_open_gaps:
  - >-
    TryResolvePassiveTerrainPenetration intentionally returns false whenever the
    fitted translation envelope is live; passive fitted-hull recovery remains a
    separate unimplemented response gate.
  - >-
    landing and exit parking use unswept TeleportPhysics rotation and location
    changes without an exact/native post-clearance transaction, so they can
    create a fitted start overlap that cannot passively recover
  - >-
    native fitted-box depenetration and rotation-changing initial penetration
    remain fail-closed in M02
  - >-
    CurrentGravityBodyId is not exposed to the ship's acceptance diagnostics, so
    the required before/after body-ID and radial-up agreement cannot yet be logged
  - >-
    the compass stable-heading cache is not keyed or reset on a dominant-body
    change and has no current nose-radial reboard runtime acceptance

