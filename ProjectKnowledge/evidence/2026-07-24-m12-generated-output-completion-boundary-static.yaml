completion_contract:
  issued_request:
    - one role per ticket; PresentationAndCollision remains query semantics rather than a completion capability
    - exact source target, volume-spec hash, chunk coordinate, per-chunk content revision and hash, authority generation, build profile, backend-instance GUID, and monotonic request token
    - detached bounded canonical density/material bytes plus the admitted portable volume spec
    - same-role retry rotates only that role ticket and invalidates its prior callback
  live_completion:
    - completion revalidates the exact pending ticket against current per-chunk metadata rather than the volume global revision
    - presentation and collision use independent tickets, pending state, readiness, and role-specific output fingerprints
    - an edit of the ticket chunk invalidates both roles while an unrelated chunk edit preserves still-current work
    - restore generation, release and same-instance recreation, new backend instance, wrong volume, wrong chunk, wrong profile, wrong token, wrong role, and malformed fingerprint fail without mutation
    - exact duplicate completion with the same output fingerprint is idempotent; a conflicting duplicate fails closed
    - already-ready work cannot be requeued and queue failure does not consume a request token
  readiness_query:
    - a ready role requires a canonical role-specific output fingerprint
    - an unready role requires an empty output fingerprint
    - combined readiness still requires both independent roles

