diagnostic_root_cause:
  initial_result: gameplay_pixels_and_component_routing_passed_but_master_wav_was_silent
  cause: >-
    In unattended unfocused editor execution, the global FApp volume multiplier
    remained zero unless background audio was allowed. Play-all-PIE alone
    bypassed per-device muting but could not override that editor-wide volume.
  correction: >-
    The editor-only harness transiently enables background audio, verifies a
    positive FApp multiplier and Client 1 primary volume, and restores the
    original setting after PIE. No production cue was replaced for this issue.

