claim_limit: >-
  This is rendered RTX 3080 D3D12 automation evidence for one actual production
  field member in one local UnrealEditor process with a listen server and
  Client 1. It proves the exact installed cue paths loaded, owner-only local
  reward and per-peer explosion audio components started, server and client
  used separate unmuted PIE audio devices, and Client 1 master output contained
  non-silent PCM during the same passing depletion, reward, HUD, and
  destruction-pixel run. A master-output recording cannot attribute individual
  samples to either cue or establish independent-player audibility, perceived
  mix quality, attenuation, or concurrency. It does not prove player-controlled
  travel, projectile or client-originated RPC delivery, simultaneous wire
  arrival, server-restart persistence, respawn policy, warning-free polish,
  packaging, Steam, two accounts, performance capacity, or broad multiplayer
  acceptance.
