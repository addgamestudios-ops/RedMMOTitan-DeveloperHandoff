    - both issued persistence request envelopes validate and bind their own target, spec, checkpoint manifest, revision, journal tail, generation, backend instance, and monotonic token
    - a second-target acknowledgement retaining its exact token but splicing first-volume checkpoint identity reaches foreign-authority rejection
    - a second-target acknowledgement retaining its full identity but using the first volume persistence token reaches exact-pending-ticket rejection
    - both exact pending acknowledgements survive and establish only their own durability bases
    - after the accepted second edit, the first export remains byte-identity-equivalent by all canonical export fields while the second export has base revision zero and exactly one second-owned revision-one operation
  isolation:
