  decisive_contracts:
    - controller and worker remain unelevated; an optional minimal VHDX provisioning broker is a separate future implementation and authorization gate
    - first implementation consumes and validates a pre-provisioned disposable local-NTFS volume and cannot manage disks
    - one fresh standalone fixed VHDX per future case, no drive letter, no permanent lifetime, and one retained creating handle
    - destructive provisioning can trust only the complete creating-handle identity chain and never a disk number alone
    - worker current directory, temporary storage, Python cache, payload, staging, and final output stay inside the exact disposable case root
    - private nonce-bound checkpoint acknowledgement replaces timing sleeps; the controller may terminate only its recorded direct child
    - exact final bytes without both authenticated COMPLETE acknowledgement and clean exit remain interrupted_valid_final_uncommitted
    - corrupt, partial, ambiguous, identity-drifted, or outside-write cases fail closed and are preserved
    - cleanup is never automatic and cannot use broad recursive deletion
    - process termination, virtualized abrupt interruption, and physical power loss are separate acceptance tiers
