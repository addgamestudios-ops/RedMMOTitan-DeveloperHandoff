route_contract:
  prerequisites:
    - requires a finite positive dominant-body frame, normalized current and target rotations, a movable query-enabled sphere root, and one rigid directly attached query-enabled fitted box
    - rejects a placement delta that differs from the movement plane constraint by more than 0.01 cm
    - bounds one transaction to 10000 cm translation and at most ninety two-degree shortest-path rotation segments
  full_route_preflight:
    - performs one native sphere-root component sweep across the complete translation route
    - for fixed rotation, sweeps the real fitted box through native collision and exact matching-PlanetGen terrain
    - for changing rotation, composes the scaled root-to-envelope offset and relative box rotation for every shortest-path screw-motion segment
    - pads each rotating proxy by its pivot-corner arc deviation plus the existing angular safety padding
    - checks every proxy through the fitted envelope collision channel and response mask plus exact matching-PlanetGen terrain
    - blocking hits, start penetration, invalid bounds, nonfinite padding, and required-planet NoMatchingPlanet all fail closed
  atomic_commit:
    - after complete route approval, performs one unswept root move inside one deferred FScopedMovementUpdate
    - analytically composed target fitted-box pose avoids stale attached-child transforms inside the deferred scope
    - fitted-box native, sphere-root native, exact endpoint, movement-hit, and requested-pose postconditions all gate success
    - every failed postcondition reverts the complete scoped move before returning false

