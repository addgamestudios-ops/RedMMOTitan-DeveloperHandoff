operation_journal_contract:
  accepted_operation:
    - binds target, volume-spec fingerprint, generated operation ID, collector, mining tool, algorithm version, prior and applied revision, request sequence, prediction token, brush center, surface normal, radius, removed-cell count, exact result fingerprint, prior operation fingerprint, and canonical operation fingerprint
    - vector coordinates use exact double bits and radius uses exact float bits rather than locale-sensitive formatting or raw struct memory
    - operation IDs and per-collector request sequences are unique inside the retained suffix
    - a repeated prediction token with a distinct request sequence remains legal because request sequence is the authoritative idempotency boundary
  bounded_export:
    - fails before an explicitly acknowledged checkpoint base exists
    - contains exactly base-plus-one through current revision in deterministic order
    - validates every operation and exact prior-revision and prior-hash link
    - rejects gaps, reorder, tampering, duplicate operation IDs, duplicate per-collector sequences, foreign target or spec, and malformed fingerprints
    - public canonicalization refuses more than the immutable 512-operation hard ceiling before string construction
    - returned operations are detached copies and export does not mutate authority state

checkpoint_acknowledgement_contract:
  issuance:
    - full bounded checkpoint remains freshly inspected by CaptureCheckpointSet
    - reusable request validation cross-checks ticket and checkpoint target, spec, revision, manifest, generation metadata, seed, and material table
    - ticket binds exact expected base acknowledgement state, base revision, base manifest, base history tail, checkpoint revision, checkpoint manifest, checkpoint history tail, authority generation, backend-instance GUID, and monotonic request token
    - reissue supersedes the older pending capability without consuming a token on failure
  acknowledgement:
    - accepts only the exact live pending ticket after target, spec, authority generation, backend instance, and expected base compare-and-swap checks
    - same-revision checkpoint capture cannot replace an acknowledged base with a conflicting manifest
    - verifies the checkpoint history tail against the exact live journal prefix
    - stages the later suffix before atomically advancing the acknowledged base and replacing the retained journal
    - exact duplicate acknowledgement of the current base is idempotent and does not discard later edits
    - stale, superseded, cross-volume, cross-instance, post-restore, post-recreate, malformed, gapped, or conflicting acknowledgement fails without mutation
    - acknowledgement is a trusted adapter declaration only and does not prove filesystem fsync, replication, or external storage health
  restore:
    - successful restore advances authority generation, clears pending and prior acknowledgement capabilities, and establishes an unacknowledged journal base at the restored revision
    - export remains blocked until the restored authority captures and explicitly acknowledges a fresh checkpoint

