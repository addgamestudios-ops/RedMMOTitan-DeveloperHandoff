  proves that UE 5.8 returned canonical FAssetData class paths and selected tags
  for 2,066 on-disk candidates without the exporter loading or mutating package
  UObjects. It does not prove licenses, PBR quality, appearance, natural
  placement, collision quality, LOD or Nanite suitability, shader or foliage
  cost, runtime streaming, gameplay, package currency, Steam, or multiplayer.

