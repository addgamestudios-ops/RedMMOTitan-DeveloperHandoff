  reference maps, and unsuitable classes; attach provenance and license-review
  state without approving unknown rights. Select one small coherent
  material/static-mesh/foliage family, then author one RedWorldAssetPalette and
  one isolated review map. Any appearance, placement, grass-cost, traversal, or
