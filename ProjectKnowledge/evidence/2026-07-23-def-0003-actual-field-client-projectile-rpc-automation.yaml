claim_limit: >-
  This is rendered RTX 3080 D3D12 automation evidence for one actual production
  field member in one local UnrealEditor process with a listen server and
  Client 1. It proves an owning autonomous client proxy invoked the reflected
  production reliable NetServer ServerFire UFunction, the authority spawned
  and delivered a replicated ARedBolt with the expected owner and instigator,
  and the actual stable member replicated exactly 6000 to 5820 ore on the
  server and Client 1 after the 180-ore projectile hit. The harness used a
  bounded test teleport and a reflected ProcessEvent call, not player-driven
  travel or physical input. Six direct authority calls completed the remaining
  depletion so this slice does not prove every mining hit or simultaneous
  final hits traversed the client wire. It does not prove naturally acquired
  range, simultaneous wire arrival, server-restart persistence, respawn policy,
  warning-free polish, packaging, Steam, two accounts, performance capacity,
  or broad multiplayer acceptance.
