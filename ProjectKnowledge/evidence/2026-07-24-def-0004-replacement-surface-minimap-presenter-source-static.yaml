  supplied_minimap_state: >-
    The only replacement minimap visual was one monolithic supplied sprite with
    baked fantasy terrain, a player marker, objective marker, and hostile
    contacts. It was intentionally collapsed in live mode because no trustworthy
    live replacement consumer existed.
  available_local_surface_backend: >-
    RedPlayerCharacter already owned a 512 by 512 local scene-capture render
    target used only by the hidden legacy HUD. It had no replacement presenter,
    explicit ownership, canonical celestial frame, mode, ordering, or teardown
    contract.
  deliberately_not_bridged:
    - legacy client-enumerated space radar contacts
    - replicated enemy-derived legacy blips
    - fabricated quest, objective, hostile, party, or sensor contacts
    - baked player, objective, and hostile markers from supplied sample art

implementation:
  presentation_contract:
    - explicit ERedHUDMinimapMode values Absent, Surface, and Space
    - Surface requires a valid local source owner, nonempty canonical celestial frame, valid texture, and positive monotonic epoch
    - lower epochs, conflicting equal epochs, stale owners, and equal-epoch resurrection after reset fail closed
    - Space and Absent detach the texture and remain visually collapsed
    - valid owner handoff resets prior presentation before the new source publishes
    - stale prior-pawn teardown cannot clear a newer pawn's registered HUD
  surface_capture_publication:
    - frame identity comes from the current stable gravity-body ID or deterministic dominant-body query
    - no invented flat-world frame identifier is used
    - publication requires non-Space mode, a canonical frame, a fresh matching-frame capture, valid capture and render target, and exact TextureTarget binding
    - Surface transitions synchronously capture before publishing
    - Space, missing frame, missing target, or target mismatch invalidates freshness and publishes no surface texture
    - the recurring local callback can update the replacement surface capture while the legacy HUD remains collapsed
  replacement_composition:
    - supplied baked minimap art remains untouched and collapsed
    - project-owned purple, gold, and teal frame surrounds one exact 512 by 512 live image
    - a local-owner center cross and LOCAL SURFACE label are presentation-only
    - all minimap children share the authored minimap origin for coherent customizer scaling
    - no contact, objective, hostile, party, or space-radar marker is invented
  lifecycle:
    - HUD registration and unregister are source-identity scoped
    - presentation epoch advances on source, texture, mode, and celestial-frame change
    - reset retains an epoch tombstone and clears the Slate brush resource
    - native presentation-state query drives replacement capture activity

