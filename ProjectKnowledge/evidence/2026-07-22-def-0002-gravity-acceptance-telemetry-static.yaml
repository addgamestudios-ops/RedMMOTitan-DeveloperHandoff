implemented_contract:
  movement_component_readback:
    - URedShipMovementComponent exposes only its cached stable gravity-body ID through a BlueprintPure const getter
    - the getter does not refresh or change dominant-body state
  explicit_snapshot:
    - ARedShip exposes LogGravityAcceptanceSnapshot as an explicit Exec and BlueprintCallable command
    - the command has no Tick, landing, reboard, exit, or other automatic invocation
    - the bounded phase is restricted to alphanumeric, underscore, hyphen, and period characters and 64 characters
  comparison:
    - the query reuses QueryDominantBodyDetailed with the cached stable ID and GravityBodySwitchHysteresis
    - cached and queried IDs must match
    - cached and queried centers and radii must remain within 1 cm
    - cached and queried radial-up vectors must have dot product at least 0.9999
    - optional settled alignment requires ship-up dot radial-up at least 0.95
  report_fields:
    - phase, local role, net mode, authority, cached and queried body IDs
    - cached and queried centers and radii, center delta, radius delta, and radial-up dot
    - ship-up dot, frame pass, alignment required, alignment pass, landing assist, and settled state
    - explicit failure reasons for unavailable world, movement, body, or invalid and mismatched frames
  mutation_boundary: >-
    The command reads cached movement state, queries the world, computes values,
    and logs them. It does not change body selection, transforms, velocity,
    movement input, landing state, parking state, compass state, or replication.

