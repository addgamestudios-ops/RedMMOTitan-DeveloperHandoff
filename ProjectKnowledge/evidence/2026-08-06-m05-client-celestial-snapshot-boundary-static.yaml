minimal_implementation_contract:
  new_files:
    - Source/RedMMO/Public/RedCelestialFrameGameState.h
    - Source/RedMMO/Private/RedCelestialFrameGameState.cpp
  modified_files:
    - Source/RedMMO/Private/RedPPGGameplayGameMode.cpp
  net_snapshot:
    reflection: USTRUCT_BlueprintType
    fields:
      - FName_StableId
      - FVector_CenterCm
      - double_NominalRadiusCm
      - uint64_Revision
    structural_validation:
      - namespaced_non_none_stable_id
      - finite_center_without_nan
      - finite_positive_radius
      - nonzero_revision
      - unique_stable_id_per_authoritative_array
    quantization_guard: >-
      Do not choose a bounded FVector_NetQuantize representation until its
      range is proven for the current 300000000 cm center.
  authority_container:
    class: ARedCelestialFrameGameState_derived_from_AGameStateBase
    property: ReplicatedUsing_OnRep_CelestialFrames_array
    writer: >-
      Authority-only UpsertCelestialFrame after registry RegisterOrUpdate and
      exact server self-readback both pass.
    game_mode_binding: >-
      ARedPPGGameplayGameMode explicitly assigns the native GameStateClass.
  client_ordering:
    late_join: accept_any_structurally_valid_nonzero_current_revision_when_absent
    existing_client: >-
      Accept strictly newer revisions. An equal revision must carry an
      identical payload; reject a lower revision or equal-revision conflict.
    skipped_intermediate_revisions: >-
      Allow them on clients because property replication may coalesce server
      states; exact plus-one ordering remains server-registry-only.
    exact_consumer: ResolveClientExact_on_GameState_not_the_authority_registry
    deterministic_array: canonicalize_by_StableId_and_reject_duplicates
  acceptance_ladder:
    - focused_static_contract
    - RedMMOEditor_build_and_native_ordering_tests
    - one_server_two_client_real_replication_test
    - initial_revision_advance_coalesced_jump_stale_equal_conflict_and_late_join_cases
    - only_then_add_an_independent_radar_or_minimap_consumer

