uaip_proxy_lifecycle:
  deployed_bridge:
    path: D:/UE_5.8/Engine/Plugins/Marketplace/UAIPMCPBridge
    version: "1.1.2"
    transport: stdio
  codex_registration:
    path: C:/Users/user/.codex/config.toml
    server: uaip_titan
    command: D:/UE_5.8/Engine/Plugins/Marketplace/UAIPMCPBridge/.venv/Scripts/python.exe
    argument: D:/UE_5.8/Engine/Plugins/Marketplace/UAIPMCPBridge/thin_proxy.py
  verified_cause:
    - Codex starts a local process for each stdio MCP client session.
    - thin_proxy.py owns one stdio server until that client's input stream closes.
    - the venv launcher resolves to a second Python runtime process, so one logical client appears as a two-process pair.
    - each proxy constructs its own LifecycleManager.
    - Saved/UAIP/mcp_proxy.lock is acquired only inside ensure_editor_running and therefore prevents concurrent editor launches, not duplicate proxy processes.
    - the first non-status UAIP tool call can auto-launch Unreal without a physical-RAM preflight.
    - an age-based or singleton-at-startup process killer would be unsafe because each live stdio process can carry a distinct active Codex connection.
  safe_cleanup_rule:
    - match both the exact Python executable chain and exact thin_proxy.py argument
    - terminate only an orphan whose root Codex parent no longer exists
    - never terminate a proxy merely because it is older while its Codex parent is live
    - never terminate unrelated Python, Codex, editor, or user-application processes
  live_followup:
    local_time: "2026-07-25T01:46:27+03:00"
    live_proxy_pairs: 1
    wrapper_pid: 35408
    runtime_pid: 32696
    root_codex_pid: 37780
    combined_working_set_mib: 63.6
    combined_private_mib: 45.6
    duplicate_reaccumulation_after_cleanup: false

durable_prevention:
  implemented:
    path: Build/Automation/Start-UnrealAIEditorGuarded.ps1
    behavior:
      - refuses a second Unreal editor
      - samples sustained physical-RAM and commit headroom before launch
      - defaults to 16 GiB free physical and 16 GiB free commit before launch
      - preserves the 8 GiB physical-RAM abort floor
      - launches one exact editor PID with UAIP port 8765 and Epic MCP port 8000 enabled
      - stops only the PID it launched if the 8 GiB floor is crossed
      - reports listeners without claiming MCP acceptance
    validation:
      powershell_parser_errors: 0
      preflight_samples_free_physical_gib: [6.99, 7.06, 7.03]
      preflight_min_free_commit_gib: 20.94
      result: correctly_refused_without_starting_unreal
      unreal_processes_after: 0
      ports_8000_8765_after: 0
  proposed_codex_configuration_migration:
    status: not_applied_to_preserve_active_codex_connection_and_require_user_decision
    rationale:
      - Codex officially supports Streamable HTTP MCP servers through a url entry.
      - UAIP's in-editor MCP server already exposes http://127.0.0.1:8765/mcp.
      - direct HTTP registration eliminates the per-client Python proxy pairs and removes the bridge's unguarded editor auto-launch path.
    exact_target: C:/Users/user/.codex/config.toml
    proposed_replacement:
      - "[mcp_servers.uaip_titan]"
      - "url = 'http://127.0.0.1:8765/mcp'"
      - "enabled = true"
      - "required = false"
    tradeoffs:
      - the guarded editor must already be running before UAIP is available
      - bridge-only uaip_get_editor_status, uaip_reload_config, auto-launch, artifact inlining, and version-check behavior are not provided by direct HTTP
      - configuration should take effect only on a later normal Codex MCP initialization; restarting Codex is not a RAM remedy
    rejected_unsafe_change: adding_a_singleton_lock_at_thin_proxy_startup

