implemented:
  - A shared native RedCelestialFrames boundary now accepts one exact namespaced stable body ID and returns an immutable pointer-free center, nominal-radius, and revision snapshot.
  - Registration, update, unregister, resolution, and world cleanup are game-thread-only. Registration additionally requires a non-client world, a valid authority actor in that world, HasAuthority, positive finite radius, and a center matching the authority actor's current location within 0.01 cm.
  - Accepted revisions begin at 1 and advance exactly by 1. Stable-ID high-water state survives unregister; stale, equal, skipped, zero, and maximum revisions fail closed. Rejected competing-authority input marks a sticky conflict without advancing accepted high-water state.
  - One live authority cannot change world or stable ID after unregistering. Conflict recovery requires exact teardown followed by a different authority's next sequential revision; no insertion-order winner remains resolvable while conflict is set.
  - RemoveWorld is rejected for a live or client world and can clear registrations, revision state, and authority state only while a server or standalone world is being or has been cleaned up.
  - The M05 protection query now resolves only BodyId through RedCelestialFrames::ResolveExact. It no longer uses FindMeshPlanet, CLMPlanet discovery, actor iteration, labels, names, radius matching, distance, or sole-candidate inference for body identity.
  - No authority-owned producer or project production RegisterOrUpdate call site is wired by this checkpoint. The M05 public query therefore intentionally fails closed at runtime until a later reviewed producer exists.
  - Existing RedGravity FindMeshPlanet declarations, definitions, and callers were not changed by this slice.
