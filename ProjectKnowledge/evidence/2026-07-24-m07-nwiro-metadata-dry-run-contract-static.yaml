  allowed_tool:
    name: find_assets
    behavior: >-
      Both inspected implementations query the local Unreal Asset Registry
      and return only name, object path, class, and count without loading a
      package UObject, rendering a thumbnail, writing a file, or calling a
      provider.
    wrapper_constraints:
      - exact nonempty searchTerm
      - exact recognized classFilter
      - exact approved /Game package-directory path
      - maxResults 2 so substring ambiguity is observable rather than hidden
      - require exactly one returned record matching the pinned name, object path, and class
      - require the exact annotated tools/list definition and its pinned canonical digest
      - require an exact tools/call JSON-RPC envelope, request id, one text content item, strict nested JSON, and no error or extra fields
  deliberately_not_allowed:
