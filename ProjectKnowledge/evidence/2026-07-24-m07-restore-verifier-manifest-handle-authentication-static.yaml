    bytes: 94387
    sha256: 2D54526021C89D312EB2761C236C6135CCE22EC909D2C78C8056FF1085334721
    changes:
      - pins the validated manifest parent for the complete authentication read and rechecks both retained-handle and lexical-path parent identity afterward
      - requests only FILE_TRAVERSE, FILE_READ_ATTRIBUTES, and SYNCHRONIZE on the manifest parent, without directory-list or create-child rights
      - opens only the manifest final component relative to that parent through NtCreateFile with FILE_OPEN, FILE_NON_DIRECTORY_FILE, FILE_SYNCHRONOUS_IO_NONALERT, and FILE_OPEN_REPARSE_POINT
      - requests only FILE_READ_DATA, FILE_READ_ATTRIBUTES, and SYNCHRONIZE on the manifest file
      - uses FILE_SHARE_READ, which permits concurrent readers while denying new writers and delete/name replacement for the retained authentication window
      - rejects directory, reparse, hard-link, offline or recall, invalid identity, non-NTFS, and unexpected-volume cases before reading
      - transfers the native handle to one CRT descriptor, cross-checks native and Python file identity, and prevents double-close on every ordinary ownership path
      - reads in bounded chunks, computes SHA-256 over those exact chunks, retains those exact bytes, and rejects size or metadata change
      - rechecks native handle, Python descriptor, lexical manifest path, and pinned parent identity before returning
      - compares the caller trust anchor and performs UTF-8 decode, duplicate-key checks, canonical JSON comparison, and semantic validation only on the captured handle bytes
