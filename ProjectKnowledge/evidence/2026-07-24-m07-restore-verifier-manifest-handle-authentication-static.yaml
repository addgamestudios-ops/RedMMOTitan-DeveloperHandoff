      - the retained native manifest handle denies a competing writer
      - manifest-parent pinning passes the exact traversal and metadata-only access mask and explicitly excludes list and create-child rights
      - the native relative open retains the supplied RootDirectory and exact least-privilege access, share, disposition, non-directory, synchronous, and open-reparse flags

