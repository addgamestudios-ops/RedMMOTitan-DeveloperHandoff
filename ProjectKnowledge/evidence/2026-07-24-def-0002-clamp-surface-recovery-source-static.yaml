implementation:
  private_recovery_policy:
    - ExactTerrainPenetration accepts only a caller-authenticated PlanetGen line-hit component and chunk key
    - LegacyVoid rejects exact witness arguments and uses native-only route and endpoint clearance
  bounded_transaction:
    - requires authority, an unattached updated root, a configured fitted collision hull, finite geometry and frame data, and a correction no longer than 100 m
    - uses the fitted hull's radial support and fixed rotation to construct the requested root and envelope endpoints
    - preflights root and fitted-envelope native blockers before mutation
    - exact recovery additionally requires reciprocal fitted-box PlanetGen crossings on the same component, actor, and chunk key with bounded point, radial, and normal provenance
    - exact and legacy endpoint checks fail closed on ambiguous terrain or native collision
    - performs one Super::MoveUpdatedComponentImpl inside one deferred FScopedMovementUpdate and reverts on target-pose or endpoint postcheck failure
  clamp_flow:
    - the outer PlanetGen line query captures the exact terrain hit and chunk key
    - matching terrain uses a three-state recovery result so clean authored crater descent can return NotRequired without being snapped to nominal datum
    - matching PlanetGen NoHit defers pose correction and removes only inward radial velocity
    - NoMatchingPlanet alone can enter the preserved WorldStatic crater check and native-only legacy recovery
    - successful pose commit alone marks bPositionCorrected; a failed correction can mark only the velocity adjustment
    - MoveWithPlanetCollision does not repeat inward-velocity containment when ClampToPlanetSurface already performed it
    - all three prior raw SetWorldLocation corrections are absent from ClampToPlanetSurface
