native_scenario_authored:
  bounded_fixture:
    - one project-owned backend uses MaxJournalOperationsPerCheckpoint equal to one
    - one exact revision-zero persistence request validates and acknowledges before any edit
    - one deterministic one-cell edit advances from revision zero to one and occupies the sole journal suffix slot
  capacity_rejection:
    - one immutable sequence-two edit carries the exact current revision, authority generation, stable IDs, brush, and prediction token
    - ApplyValidatedEdit returns handled true while the result is accepted false with JournalCapacityReached
    - the validated rejection retains revision one and contains zero removed cells, zero material yields, and zero dirty chunks
    - authority revision and generation, the checkpoint manifest and every chunk payload, and the complete one-operation journal identity remain exact
  capture_versus_acknowledgement:
    - one revision-one persistence request binds the acknowledged revision-zero base, the full checkpoint manifest, and the first operation tail
    - submitting the identical refused edit after capture but before acknowledgement returns the same capacity rejection
    - the untouched exact pending ticket remains usable after that second refusal
    - exact acknowledgement advances only the journal base to revision one and compacts the covered operation into an empty suffix without changing density, current revision, or authority generation
  immutable_retry_and_rechain:
    - the exact previously refused edit is not reconstructed or mutated between refusal and retry
    - the same sequence and prediction token succeed once after acknowledgement and advance revision one to two
    - the sole final exported operation preserves exact target, collector, tool, brush, sequence, and prediction identity
    - the operation previous-tail hash equals the acknowledged revision-one checkpoint tail and its canonical hash becomes the final tail
  isolation:
    - all eight native automation macros and backend-using code remain inside WITH_DEV_AUTOMATION_TESTS
    - every registration is ProductFilter and has one exact automation path
    - the new scenario excludes ReleaseVolume, restore, multi-volume, generated-output, actor, world, map, Inventory, mesh, voxel-plugin, Steam, and filesystem-adapter APIs

