defect_closed_in_source:
  prior_behavior:
    - IRedVoxelAsteroidBackend exposed void ReleaseVolume with only a stable ID
    - the sole implementation blindly removed the current same-ID volume
    - a delayed generation-one owner could therefore delete a recreated generation-two authority volume
    - the eight existing native scenarios explicitly excluded ReleaseVolume
  corrected_behavior:
    - ReleaseVolume returns bool and requires StableId, ExpectedAuthorityGenerationToken, and OutError
    - game-thread, nonzero-token, target-existence, and exact-generation checks all precede the sole removal
    - zero, missing, stale, and future generations fail without changing the live volume
    - exact release removes one generation while LastIssuedGenerationTokens remains intact
    - no alternate backend implementation or runtime callsite exists

