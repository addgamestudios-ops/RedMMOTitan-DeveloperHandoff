native_scenario_authored:
  lifecycle_sequence:
    - generation one initializes with a canonical checkpoint
    - zero-generation release rejects and preserves generation one
    - exact generation-one release succeeds and a duplicate missing release rejects
    - the same stable ID recreates with generation two equal to generation one plus one
    - generation two receives one accepted deterministic edit and a complete checkpoint capture
    - stale generation-one and future-generation release requests both reject
    - after stale rejection, generation-two revision, generation, manifest, chunk identities, and compressed chunk bytes remain exact
    - exact generation-two release succeeds and the same stable ID recreates with generation three equal to generation two plus one
  mutation_sensitive_static_checks:
    - require game thread precedes zero-token rejection
    - zero-token rejection precedes lookup
    - missing-target rejection and exact-generation comparison precede the sole live-volume removal
    - error clearing and success follow removal
    - stale, future, and exact result variables are bound to their intended generation arguments

