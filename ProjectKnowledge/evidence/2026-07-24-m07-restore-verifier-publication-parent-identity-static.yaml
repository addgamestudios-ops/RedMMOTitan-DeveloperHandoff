implementation:
  verifier:
    path: Tools/verify_redmmo_content_storage_restore.py
    bytes: 84325
    sha256: B966EED2B249EE26DC80D7ABE6A87C676E37E4947C8D9B375413F160E4302778
    changes:
      - validates and retains the diagnostics-root handle, local-NTFS filesystem type, non-reparse metadata, and volume-serial plus 64-bit file-index identity
      - traverses or creates each output-parent component relative to retained directory handles with NtCreateFile and rejects reparse directories
      - creates a randomized same-parent staging file with exclusive share mode, FILE_ATTRIBUTE_NORMAL, one link, and zero initial bytes
      - writes the complete payload through the retained staging handle, calls FlushFileBuffers, and rechecks handle identity, size, link count, and reparse metadata
      - publishes the still-open staging file with NtSetInformationFile FileRenameInformation, the retained parent RootDirectory, and flags zero so an existing final report is never replaced
      - performs failure cleanup by marking the retained staging handle for deletion rather than unlinking a pathname
      - rechecks that the lexical parent still names the pinned parent identity and that the final path names the exact flushed staging-file identity
      - rejects report publication on non-Windows systems rather than retaining an unpinned path-based fallback
      - leaves native 128-bit FILE_ID_INFO identity, parent-directory durability flush, and non-NTFS publication as explicit later gates
  tests:
    path: Tools/tests/test_verify_redmmo_content_storage_restore.py
    bytes: 47168
    sha256: 9EDE807ECBB238FA877A7196B66CAB78ABD9809273F54DA459406CC32825E570
    added_contracts:
      - a parent junction inserted after validation is rejected before publication
      - a parent swapped after pinning cannot redirect final publication or failure cleanup, and attacker staging-name and final-name sentinels survive byte-exact
      - a late competing final report is not clobbered and leaves no staging file
      - the staging handle denies a second writer and the published final lacks FILE_ATTRIBUTE_TEMPORARY
      - the native rename call uses the retained parent handle, FileRenameInformation class, flags zero, and the exact final filename

