reproduced_pre_fix_defect:
  affected_boundary: diagnostics_report_output_parent
  observation:
    - the old flow validated a lexical output path and then created and published through that path
    - replacing the validated parent with a junction redirected the report into an attacker-controlled directory
    - path-based failure cleanup could also address the replacement directory rather than the directory originally validated
