implementation:
  replacement_route:
    - ARedHUD exposes its validity-checked active URedHUDWidget
    - every visible move, scale, opacity, visibility, lock, element reset, and reset-all action resolves URedHUDWidget
    - legacy UVibeMMOHUDWidget customization references were removed from the pause menu while its gameplay data and loadout paths remain unchanged elsewhere
  transaction:
    - preview snapshots the existing per-local-player FVibeMMOHUDLayoutProfile
    - Cancel restores and synchronously saves through UVibeMMOHUDLayoutSubsystem even if the replacement widget disappears
    - a failed restore retains the active transaction instead of discarding its rollback snapshot
    - Apply synchronously saves through the same local-player subsystem and refreshes the rollback baseline only after success
  dead_control_prevention:
    - the selectable replacement list contains eight currently mapped groups
    - Reticle is excluded because URedHUDWidget still maps no replacement reticle widget
  known_static_caveat:
    - >-
      URedHUDWidget mutation methods can report success for clamped or
      already-default no-ops, so limit/reset feedback still needs runtime
      hardening and acceptance.

