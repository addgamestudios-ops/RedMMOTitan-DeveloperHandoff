current_source_contract:
  verified_present:
    - RegisterMiningHit rejects non-authority, depleted, and non-positive requests
    - extracted ore is bounded by OreRemaining and the server forces a net update
    - OreRemaining uses ReplicatedUsing and is included in lifetime replication
    - the depletion refresh runs on both server mutation and OnRep_OreRemaining
  root_cause:
    - >-
      RefreshDepletedState derives one boolean directly from OreRemaining and
      immediately calls SetActorHiddenInGame(true) at zero
    - collision is disabled in the same immediate refresh with no presentation interval
  missing_contracts:
    - no replicated active, depleting, or depleted state machine
    - no authoritative transition timestamp or bounded cleanup timer
    - no destruction VFX, debris actor, fracture event, or sound handoff
    - no resource pickup or inventory/reward handoff from asteroid depletion
    - RedBolt ignores RegisterMiningHit's extracted-ore return value
    - no explicit late-join depleted or respawned-state contract
  chronology_limit: >-
    The current asteroid source timestamp postdates the reproducing runtime log,
    so the log does not authenticate this exact source identity. The present
    source independently retains the same immediate-hide mechanism and still has
    none of the required transition contracts.

