      - recomputes and requires the exact payload and path-set signatures
    output_contract:
      - emits one canonical JSON report only below D:/RedMMOTitanWindowsData/Diagnostics
      - rejects existing output, output inside the restore, and lexical or resolved reparse escape
      - uses same-directory flush, fsync, and no-clobber rename on the target Windows platform
    explicit_limits:
