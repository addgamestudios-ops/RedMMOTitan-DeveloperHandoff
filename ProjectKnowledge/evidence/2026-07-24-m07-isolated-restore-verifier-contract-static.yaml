    restore_contract:
      - performs a complete scandir and lstat traversal without following links
      - rejects reparses, non-regular files, hard links, duplicate file identities, offline or recall-on-access placeholders, unsafe names, extra files, missing files, extra empty directories, and directory topology outside manifest-implied parents
