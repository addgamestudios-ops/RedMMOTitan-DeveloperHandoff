    added_contracts:
      - a live D-resident NTFS handle returns stable repeated native identity while retaining its Python stat bridge
      - the deterministic API contract uses class 18 and a 24-byte result, preserves nonzero upper identifier bytes and a greater-than-32-bit volume serial, and distinguishes identities that differ only in the upper identifier bytes
      - unavailable native identity and all-zero native identity fail without a legacy fallback
      - both native identity contracts are explicitly Windows-only

