      - makes frozen-dataclass revalidation include the full native identity automatically
      - compares manifest and parent volumes with the native 64-bit serial
      - compares report temporary-file handles before and after writing with the exact native volume serial and all 16 identifier bytes
      - preserves local-NTFS enforcement, retained-parent relative opens, no-delete manifest-parent sharing, reparse checks, legacy path bridges, and non-Windows behavior
  tests:
    path: Tools/tests/test_verify_redmmo_content_storage_restore.py
    bytes: 75504
