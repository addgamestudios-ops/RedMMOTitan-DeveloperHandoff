implementation:
  verifier:
    path: Tools/verify_redmmo_content_storage_restore.py
    bytes: 99395
    sha256: C371B3978E8B3516A03E537195D505F3B03811C9EFA1A4E76AB4B71409CD7C88
    changes:
      - defines FileIdInfo class 18 and the natural-layout 24-byte FILE_ID_INFO representation containing an unsigned 64-bit volume serial and opaque 16-byte identifier
      - extends immutable Windows handle metadata with identity_volume_serial and file_id_128 while preserving legacy volume_serial and file_id fields for Python stat comparisons
