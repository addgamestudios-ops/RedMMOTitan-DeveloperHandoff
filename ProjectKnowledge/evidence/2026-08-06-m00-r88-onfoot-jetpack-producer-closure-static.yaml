authority_blocker:
  finding: >-
    The legacy ServerSetJetpackInput accepts client-supplied engaged, thrust,
    boost and orbital-thrust booleans and rejects only the downed state before
    assigning them. Its lift/fuel tick runs on both authority and autonomous
    proxy, and no jetpack-specific saved-move/compressed prediction contract
    was identified. That cannot be copied as the clean multiplayer authority
    contract.
  required_contracts:
    - server-owned replicated fuel and engaged/thrust/boost state
    - transition-intent RPCs rather than client-authored state values
    - server validation for possession, movement availability, fuel, state and ordering
    - defined autonomous prediction and server correction
    - forced shutdown before ship possession and while hidden or movement-disabled
    - resource read API for a later project-owned authored HUD presenter

