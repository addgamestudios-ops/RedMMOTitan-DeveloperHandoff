native_scenario_authored:
  pre_restore_state:
    - deterministic edit one is checkpointed and acknowledged as revision-one durability base
    - deterministic edit two creates one real revision-two retained journal suffix
    - a pending revision-two checkpoint is freshly inspected into a trusted verification result
  corruption_rejection:
    - one compressed checkpoint payload byte is flipped while its recorded hashes remain unchanged
    - bounded inspection and atomic restore both reject the corrupted checkpoint
    - live revision, authority generation, checkpoint manifest, journal export manifest, suffix count, and suffix operation identity remain unchanged
  exact_restore:
    - exact revision-two checkpoint and exact live revision and generation compare-and-swap precondition succeed
    - content revision remains two and authority generation advances exactly once
    - a newly captured live checkpoint preserves the restored content manifest
  durability_invalidation:
    - the earlier acknowledged revision-one base ticket is rejected after restore as stale authority state
    - the pending revision-two persistence ticket is independently rejected after restore as stale authority state
    - journal export remains blocked because restore deliberately establishes an unacknowledged base
  fresh_boundary:
    - fresh capture binds restored revision two and the advanced authority generation
    - it expects no prior acknowledged manifest or journal tail and carries no stale operation tail
    - capture alone cannot promote durability
    - exact fresh acknowledgement exports base two through revision two with zero operations and empty base and final tails
    - the fresh canonical export differs from the pre-restore suffix and validates
  isolation:
    - both native test macros, backend includes, and backend-using code remain inside WITH_DEV_AUTOMATION_TESTS
    - each native scenario creates its own backend instance
    - no actor, world, map, Inventory, mesh, voxel plugin, Steam, or filesystem adapter is referenced

