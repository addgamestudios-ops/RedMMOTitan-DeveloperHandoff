verified_controls:
  continental_landmass:
    - the first enabled noise layer is the continental base and masks every finer terrain layer
    - its Frequency controls the coarsest feature wavelength; lower values create larger smoother landforms
    - SeaLevel determines how much of that deterministic field is exposed as land versus ocean
    - Seed reproduces the same world
    - WarpStrength and WarpFrequency distort large boundaries without changing ownership
  mountain_and_hill_readability:
    - MountainThreshold controls mountain coverage
    - MountainBlend controls the plains-to-mountain transition width
    - per-layer Amplitude, Octaves, Lacunarity, Persistence and Weight control height and high-frequency detail
    - the Smooth preset is a single low-frequency Perlin layer with two octaves and 0.30 persistence
    - the Mountains preset deliberately uses ridged and cellular layers and is therefore the wrong starting point for broad runnable hills
  biome_regions:
    - ClimateScale lowers to fewer larger biome regions and raises to more smaller regions
    - LatitudeWeight, TempFrequency, HumidFrequency and independent seed offsets control deterministic climate layout
    - BiomeBlend controls visual or foliage transition width
    - HeightBiomeSharpness and per-biome HeightAmplitude or HeightBias control terrain relief separately from material boundaries
    - the four native climate corners are Tundra, Boreal, Desert and Tropical
    - each biome independently exposes vegetation density, low-elevation sand amount, height amplitude and height bias
  shoreline:
    - BeachHeight and BeachFlattenStrength provide a deterministic runnable coastal shelf

absent_supported_controls:
  - no public river generator, river spline, road spline, trail generator or authored-path API was found in the installed PlanetGen 1.7 public source
  - no level-pad, construction-clearance, reservation or localized flatten-area control was found in the installed PlanetGen 1.7 public source

finding: >-
  PlanetGen 1.7 can natively move the current island-speckled result toward
  fewer, broader continents and clearer biomes while retaining a seed: lower
  the continental base frequency, choose sea level deliberately, reduce fine
  layer amplitude, octaves and persistence, widen MountainBlend, use broad
  biome regions through ClimateScale, and flatten selected biome relief through
  HeightAmplitude and HeightBiomeSharpness. These are supported deterministic
  controls, not a guarantee of an accepted planet. Authored pathways, rivers,
  build pads and local level-design clearances are not native public controls;
  they require a separate project-owned deterministic stamp or reservation
  layer and must not be faked as part of a simple material or biome rebind.

