authority_contracts:
  request_and_revision:
    - client envelope contains no yield, amount, removed volume, removed-cell count, or material ID
    - server edit and backend result bind exact target, sequence, expected revision, prediction token, and authority generation
    - one global volume revision advances monotonically while each collector retains its own contiguous sequence high-water
    - rejection retains revision and contains no removed cells, yield, or dirty chunks
  material_and_bounds:
    - accepted yield is calculated from removed-cell count times authoritative cell-size cubed
    - edited cells, dirty chunks, yield entries, loose clusters, request rate, dimensions, checkpoint chunks, and bytes have immutable hard ceilings
    - checked positive multiplication guards volume, chunk, checkpoint, and cell-count calculations
  identity_and_checkpoints:
    - immutable volume fields have deterministic canonical serialization and a recomputed project-owned SHA-256 fingerprint
    - each checkpoint binds stable ID, dimensions fingerprint, seed, material table, coordinate, generation version, revision, allowlisted codec, decompressed size, and canonical payload SHA-256
    - whole-volume validation requires the exact complete unique chunk set, one common revision, canonical manifest SHA-256, and aggregate byte ceiling
    - atomic restore is compare-and-swap constrained to absent initialization or exact current revision and generation under a quiesced replacement; live rollback to an older revision is forbidden
  generated_outputs:
    - exact target, coordinate, content revision, content hash, and advanceable generation token reject stale asynchronous output
    - dedicated-server collision readiness and client presentation readiness can be required independently
  logical_suction_and_credit:
    - server-owned cluster states advance one revision through bounded transitions
    - reservation proof remains server-private and future replication requires a separate reflected DTO
    - credit requires matching cluster, source, collector, reservation, observed revision, eligibility, line of sight, arrival distance, arrival timing, and collected transition
    - output credit carries ClusterId plus CollectedRevision as the durable-ledger idempotency tuple

