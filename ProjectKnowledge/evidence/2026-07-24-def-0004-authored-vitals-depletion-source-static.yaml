root_cause:
  gameplay_feed: >-
    RedPlayerCharacter publishes live shield, health, and fuel values; RedHUD
    maps fuel into the replacement presentation's generic Energy fields; and
    URedHUDWidget computes the correct normalized fractions.
  presentation_failure:
    - the supplied T_REDHUD_PlayerStatus image already contains painted gold, teal, and purple bars
    - three nearly opaque full-width masks covered those authored pixels
    - three hard-coded yellow, teal, and purple UBorder rectangles were painted above the masks
    - AddFill created an untextured Slate Box brush and SetFillPercent only resized that flat rectangle
    - depletion therefore exposed a cheap solid fill rather than retaining the supplied painted texture
  semantic_note: >-
    The current lower purple bar represents jetpack fuel through the generic
    Energy presentation field. No independent mana producer or mana bar was
    found or fabricated in this slice.

implementation:
  authored_art_strategy:
    - keep the existing PlayerStatus UImage and texture byte-exact
    - remove only the three player full masks and flat-color live fills
    - retain the separate health-number mask because it covers baked sample text
  depletion_mask_contract:
    - one player-only FMutableDepletionMask path leaves generic enemy and weapon fills unchanged
    - each mask is anchored at the authored bar's right edge
    - full value initializes to zero mask width so no first-frame dark flash replaces the painted bar
    - partial value covers only the depleted right-hand tail
    - zero value covers the full bar interior
    - normalized input remains clamped through the existing SafePercent and the new inverse-width update
  preserved_domains:
    - gameplay values and fuel-to-Energy bridge
    - authority and replication
    - generic enemy health and weapon heat fill behavior
    - PlayerStatus layout and health-number presentation
    - supplied raster and imported texture assets

