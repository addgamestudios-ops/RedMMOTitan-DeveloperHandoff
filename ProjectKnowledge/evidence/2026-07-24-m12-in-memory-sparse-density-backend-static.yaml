backend_contract:
  storage:
    - non-empty chunks use a project-owned sparse chunk map; every chunk retains authenticated revision metadata
    - one canonical byte represents binary empty or solid density together with fixed Stone, Iron, or Crystal material ordinal
    - the deterministic integer sphere occupies 27 to 36 metres at the 64-cell, 75 to 100 cm profiling candidate
    - only red.material-table.prototype-v1 is admitted
  edits:
    - already validated server brush commands stage candidate cells, material yields, dirty chunks, hashes, operation record, and apply result before committing
    - accepted yield is exact removed-cell count times authoritative cell-size cubed
    - zero-volume, stale revision, stale generation, edited-cell cap, dirty-chunk cap, revision overflow, and journal-cap paths fail without live mutation
    - the private journal fails closed at its ceiling; export, replay, durable checkpoint acknowledgement, and compaction remain unimplemented
  checkpoints:
    - portable checkpoints carry the complete immutable volume spec and bounded authority policy required to inspect an absent volume
    - canonical uint16-run RLE is bounded, recompressed byte-for-byte, and hashes decompressed one-byte cells
    - whole-volume manifests bind the complete spec, policy, revision, exact sorted chunk set, codec, byte counts, and payload integrity hashes
    - restore independently re-inspects caller payloads and verification, decodes all chunks to temporary state, checks exact compare-and-swap state, then enters one final game-thread commit block
    - revision-zero deletion, impossible removed-cell counts, material injection, material resurrection, revision inflation without matching subtractive cells, live rollback, and equal-revision equivocation fail closed
  stale_work:
    - generated chunk identity binds canonical volume-spec hash, chunk coordinate, authoritative cells, content revision, and lifecycle generation
    - stable-ID generation tombstones survive ReleaseVolume inside the backend lifetime and prevent release/recreate ABA
    - QueueChunkRebuild accepts only exact current identity and deliberately leaves presentation and collision readiness false
    - no output completion adapter exists yet, so this source does not claim generated mesh or collision readiness
  scale:
    max_volume_cells_per_axis: 64
    max_chunk_cells_per_axis: 16
    max_edited_cells_per_request: 2048
    max_dirty_chunks_per_edit: 8
    max_journal_operations: 512
    max_checkpoint_chunks: 64
    max_checkpoint_set_bytes: 16777216

