implemented_contract:
  authority_and_exactly_once:
    - mining remains authority-gated and clamps ore at exact zero
    - only Active may enter Depleting, so simultaneous final hits cannot start a second transition
    - the replicated atomic payload carries Active, Depleting, Depleted, server start time, duration, sequence, reward-spawned, and reward-granted state
    - sequence-checked timers prevent stale callbacks from mutating a newer state
  presentation_and_collision:
    - collision shuts down immediately when authority enters Depleting
    - the intact asteroid remains visible for a bounded default two-second presentation interval
    - Depleted hides but does not destroy the asteroid, preserving a live-session late-join result
    - clients without GameState keep collision off and retry until synchronized server time exists; client-local world time is never compared to the server timestamp
  destruction_feedback:
    - an asteroid-specific replicated explosion factory uses 15 km net cull and five-second actor life instead of global relevance
    - explosion start time and a maximum 0.5-second replay window are initial-bunch replicated
    - late joiners outside the replay window suppress fresh explosion, sound, light, and local Chaos debris creation
    - Chaos debris remains client-local cosmetic physics and cannot damage or push players
  reward_delivery:
    - the mining player's server inventory is credited once when the ship or character resolves through the instigator chain
    - Stone, Iron, and Crystal totals now replicate and RepNotify the HUD
    - one finite-range replicated receipt actor carries type, amount, radial up, and collectible state
    - a directly granted receipt is noncollectible and server-bounded to four seconds
    - fallback collectible overlap is authority-only, phase-guarded by consumed state, and disables collision before credit and destruction
  durability_boundary: >-
    Depleted state is durable for the live replicated actor and live-session late
    join. BeginPlay still initializes a fresh actor, so server-restart persistence
    and an explicit respawn policy are not implemented.

