finding: >-
  PlanetGen 1.7 has genuine built-in shoreline support: a sea-level water
  owner, a configurable flattened beach band, a beach-sand weight, a distinct
  underwater weight, and a separate desert-sand weight. Its stock material
  graph also separates sand and underwater functions. It does not expose
  independent named dry-sand and wet-sand shoreline masks or a dedicated wet
  strip above the waterline. Therefore the installed plugin provides a useful
  deterministic shoreline foundation, but the desired narrow dry-to-wet sand
  transition still needs a project-owned material treatment driven from these
  existing weights and sea-level distance; it is not already a complete stock
  feature.

