remaining_risks:
  - The strict resolver identifies RED Mars only as the sole valid CLMPlanet candidate with the expected radius; the actor itself is not authenticated by an immutable stable celestial ID, so ADR-0001 remains open.
  - Uniqueness and reflected radii are cached after successful discovery. A later streamed/spawned duplicate or runtime property mutation is not revalidated by this interim resolver.
  - Actor iteration and the cache are game-thread-only. Production worker tasks must not call this path directly.
  - No valid UWorld fixture exercised missing or duplicate PlanetGen branches. The C++ tests are authored but have not compiled or run.
  - The registry has no reviewed production PCG/WorldGen consumer, and serialized maps/DataAssets have not been inspected for overrides.
  - Dedicated road, lake, river, and handplaced-structure masks remain absent; authority rasters are not PCG masks.
