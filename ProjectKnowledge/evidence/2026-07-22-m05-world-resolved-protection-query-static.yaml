implemented:
  - The public Blueprint protection query no longer accepts a caller-authored planet center. It accepts a WorldContextObject, the canonical body ID, feature tag, and world point.
  - The query resolves the home PlanetGen frame through RedGravity, reads the raw reflected PlanetRadius instead of inferring it from gameplay datum or peak radii, and rejects nominal-radius drift beyond 1 cm from the protected 50 km profile.
  - The new five-argument frame resolver requires exactly one valid PlanetGen actor during cold resolution and fails closed on an ambiguous world. The existing four-argument exported resolver and all legacy three/four-argument call sites retain their prior symbol and first-candidate behavior.
  - Worker-thread calls fail closed before world lookup or actor/cache access. A future asynchronous PCG or WorldGen adapter must consume a game-thread-owned immutable frame snapshot.
  - The private synthetic-center geodesic helper is not reflected and is exposed only to the focused automation-test class.
  - Authored C++ protection tests now cover every reservation center, all blocked feature tags, exact hard and blend boundaries, half blend, outside range, wrong body, unknown tags, zero direction, wrong/invalid radius, invalid coordinates, null context, and a context without a world.
  - The registry remains query-only and unwired. It does not activate PCG or WorldGen, spawn actors, alter maps, or enable surface dressing.
