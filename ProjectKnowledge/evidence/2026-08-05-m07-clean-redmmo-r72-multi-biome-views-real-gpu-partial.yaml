independent_visual_review:
  proven:
    - all four viewport files are byte-distinct and come from exact live generated chunks whose dominant runtime roles are Hills, Desert, Mountains and Ocean
    - Hills visibly retains the approved dense tall grass and painted pale-green ground, with no palm visible
    - Mountains visibly differs from Hills through a cool gray-blue painterly-rock surface and scattered approved rocks, with no palm visible
    - the Trooper is present in every frame and the Ocean frame shows the retained analytic starfield
  retained_defects:
    - the Desert frame is not composition-valid because the third-person camera intersects the Trooper; the sand itself is visibly warm and distinct, but this frame cannot judge a desert biome
    - the Mountain role still inherits dense grass because Hills, Mountains and Craters share the retained R66 foliage binding; this defeats a clean highland biome and needs a project-owned per-role foliage split, not manual placement
    - the below-sea Ocean-role terrain reads pale tan rather than the intended aqua-tan treatment, and no shoreline or functioning water transition is visible; Ocean/coast presentation therefore fails
    - Unlit view intentionally removes day/night as a confounder, so the black Unlit background is not accepted night evidence and these frames do not supersede the separate R68 night gate
    - no capture proves beach width, shoreline, water material behavior, terrain smoothing, continent silhouette, paths, physical controls or standalone play
  overall_art_acceptance: partial_fail

retention_decision: >-
