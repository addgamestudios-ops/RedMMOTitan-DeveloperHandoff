implementation:
  verifier:
    path: Tools/verify_redmmo_content_storage_restore.py
    bytes: 60112
    sha256: 55158F2372DE09A3CC29312D1222616A024470EBD18241FF8CEE4858AB5A03C4
    changes:
      - retains lexical ancestor checks as the fast path and unchanged non-Windows behavior
      - derives each existing Windows path identity from the nonzero device and inode pair already used by the verifier file-identity model
      - compares each endpoint identity only with the other path's existing ancestor chain in both directions, avoiding the false positive that would result from intersecting complete ancestor sets
      - handles not-yet-created report paths by walking to their nearest existing ancestors
      - makes missing or zero stable identity a fail-closed RestoreVerificationError
      - validates the active Unreal project itself as a plain non-reparse directory for both CLI and direct verification paths
      - accepts normal local DOS paths and their tested extended-DOS aliases
      - rejects UNC, extended-UNC, device, volume-GUID, and DFS namespaces before metadata traversal
      - queries GetDriveTypeW and rejects unknown, missing-root, and remote mapped-drive inputs
      - narrows the generated report claim to point-in-time local-DOS validation and explicitly leaves directory handles unpinned
  tests:
    path: Tools/tests/test_verify_redmmo_content_storage_restore.py
    bytes: 35262
    sha256: 419F298DDAC37CA26BBE894D6E46DFA6164374E331B29CC56AB343712CECF056
    added_contracts:
      - exact and descendant extended-DOS aliases cannot bypass active-project isolation
      - an extended-DOS restore containing the active project cannot bypass reverse-containment isolation
      - a manifest inside an extended-DOS spelling of its restore remains rejected
      - an extended-DOS restore cannot hide a diagnostics report inside itself, while a distinct sibling remains accepted
      - zero stable path identity fails closed
      - UNC, extended-UNC, device, volume-GUID, and remote mapped-drive inputs fail closed

