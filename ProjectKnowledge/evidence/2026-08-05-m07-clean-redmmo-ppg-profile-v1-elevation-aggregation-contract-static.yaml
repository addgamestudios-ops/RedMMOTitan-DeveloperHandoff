authenticated_native_contract:
  global_height:
    behavior: >-
      Planet Elevation Output compiles Global Height as custom output one,
      evaluates it once into PPGGlobalHeight, and exposes it to each biome
      branch through Planet Global Height. It is not added to final elevation.
    unconnected_behavior: compiles_to_zero
  biome_heights:
    behavior: >-
      Each contributing biome output is evaluated independently under its
      actual cell context, then Planet.usf computes final elevation as
      dot(biomeHeights, top4CellStrengths).
    connected_profile_v1_inputs: [Craters, Mountains, Desert, Hills, Poles, Ocean]
  post_blend_material_graph_hook: false
  native_flatten:
    inputs: [Elevation, Water Level, Threshold]
    default_water_level: 0.0
    default_threshold: 0.005
    behavior: smoothstep_distance_then_lerp_to_water_level

supported_unbound_design:
  shared_scalar:
    parameter_name: ShorelineFlattenThreshold
    default: 0.005
    identity: RedProfile.ShorelineFlattenThreshold
  wrapper_count: 6
  wrappers:
    - {role: Craters, source: MaterialExpressionAdd_0, target: Craters Height}
    - {role: Mountains, source: MaterialExpressionReroute_0, target: Mountains Height}
    - {role: Desert, source: MaterialExpressionDivide_0, target: Desert Height}
    - {role: Hills, source: MaterialExpressionAdd_3, target: Hills Height}
    - {role: Poles, source: MaterialExpressionSubtract_3, target: Poles Height}
    - {role: Ocean, source: MaterialExpressionSubtract_4, target: Ocean Height}
  exact_wiring_per_role:
    - existing branch root to native Flatten Elevation input
    - shared scalar to every Flatten Threshold input
    - Water Level unconnected at native zero default
    - Flatten output to the same named biome-height input
  global_height_action: leave_unconnected

behavioral_boundary:
  supported_order: blend_of_per_biome_flattened_heights
  unsupported_exact_order: flatten_after_final_biome_blend
  mathematically_equivalent_at_transitions: false
  reason: >-
    Native flatten uses nonlinear smoothstep, so blending already-flattened
    biome samples can differ near transitions from flattening the final blended
    height. Exact post-blend behavior requires a separately approved
    project-owned PPG shader/plugin extension after the final dot product.

