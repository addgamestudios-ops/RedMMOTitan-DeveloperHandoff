no_mutation_decision:
  timer_pause_or_clear_on_hide: >-
    No single visibility owner or resume contract spans HUD/pawn BeginPlay
    ordering, loadout open/close, replacement-HUD failure fallback,
    PawnClientRestart, possession changes, travel, and destruction. A timer
    that self-clears has no current restart path.
  prewarm_deferral: >-
    Deferral can expose blank portrait/minimap resources until the alternating
    timer services both targets. The recurring path deliberately interleaves one
    capture per callback for the documented Metal concern, while the two
    synchronous prewarm calls and actual Metal safety remain runtime-unverified.
  render_target_release_or_persistent_state_disable: >-
    Releasing or detaching targets changes Slate brush resource lifetime,
    UObject/GC ownership, rebind order, capture history, and first-visible-frame
    hitch behavior. Static source cannot prove those transitions safe.
  proportionality: >-
    The residual hidden topology includes 6.6667 scheduled guarded callback
    wakes per second plus the retained targets and rendering state; actual CPU,
    GPU, and RHI-memory cost or savings require measurement before accepting
    lifecycle risk.
  independent_review: pass_inventory_and_blocker_record_no_source_change

