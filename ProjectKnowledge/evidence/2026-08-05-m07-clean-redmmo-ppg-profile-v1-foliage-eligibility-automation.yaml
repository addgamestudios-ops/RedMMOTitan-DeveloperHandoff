installed_source_finding: >-
  BuildFoliageDispatchParams constructs configurations only from non-null
  biome FoliageData. The GPU foliage shader then weights each configuration by
  local biome strengths whose FoliageSources entry matches that source. A
  region classified wholly into Desert, Ocean or Poles therefore emits no
  foliage even though the approved R10O data and mesh bindings are valid.

conclusion: >-
  The working R10O packed BLUE-density graph topology and exact grass profile
  survive into ProfileV1. The meaningful authority change is the biome mask:
  R10O used the stock example mask, while ProfileV1 uses the project-owned R15
  continent mask with three intentionally null foliage biomes. Coupled with
  the fresh runtime's zero GPU foliage components at PlayerStart, the leading
  source-backed failure is local classification into a null-foliage biome, not
  spawn altitude, mesh substitution, density 90, or a disconnected packed
  vertex-color path. Exact PlayerStart biome strength still requires one
  runtime sample before a binding mutation.

