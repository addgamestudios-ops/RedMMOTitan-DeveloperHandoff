implemented_contract:
  placement_transaction:
    - requires a movable registered query-enabled root and its live attached fitted UBox envelope
    - rejects nonfinite target location or nonnormalized target rotation before mutation
    - analytically composes the fitted-envelope target location and rotation from the root target pose
    - opens one deferred FScopedMovementUpdate and commits through Super::MoveUpdatedComponentImpl
    - probes fitted-envelope native overlap, root native overlap, and exact matching-PlanetGen endpoint clearance
    - verifies the root reached the requested pose and reverts the scoped move on any failed postcondition
  landing_assist:
    - incremental alignment, settled repin, unpossessed descent, and touchdown all use the transaction
    - landing settles only after a successful commit and only authority publishes the settled state
    - each failed placement removes only negative radial velocity and leaves tangential/outward velocity intact
  normal_surface_exit:
    - commits the radial fitted-support parking transform before releasing the pilot
    - rejects exit before input, velocity, possession, fire, boost, or pilot state changes when parking is not clear
    - emergency and orbital exits explicitly preserve their established surface-parking bypass
  scope_limit: >-
    The transaction proves the requested endpoint only. It does not sweep or
    prove the full route between current and target poses.

