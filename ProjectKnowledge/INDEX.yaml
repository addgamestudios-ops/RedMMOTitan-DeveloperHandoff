schema_version: 1
knowledge_version: 1
project: RedMMOTitan
path_convention: repo_relative_forward_slash

purpose: >-
  Compact routing for durable project facts, constraints, reusable authoring
  records, defects, acceptance gates, and architecture decisions. Long build
  history stays in the existing queue and domain specifications.

authoritative_sources:
  work_queue:
    path: Build/Automation/redmmotitan_module_queue.json
    owns: module_status_and_detailed_evidence_history
  current_snapshot:
    path: ProjectKnowledge/current_state.yaml
    owns: concise_verified_state_and_open_risks
  invariants:
    path: ProjectKnowledge/invariants.yaml
    owns: cross_domain_non_negotiable_rules

domain_specs:
  - path: docs/PLANET_50KM_IMPLEMENTATION_SPEC.md
    domains: [planet_geometry, fused_authoring_inputs, water, collision, streaming, acceptance]
  - path: docs/PLANETGEN_PINNED_FORK.md
    domains: [planetgen_fork, rollback, test_profile]
  - path: docs/PLANET_TERRAIN_AUTHORING_PLAN.md
    domains: [macro_heightfield, masks, runtime_consumers]
  - path: docs/PLANET_PATCH_AUTHORING_GUIDE.md
    domains: [tangent_patches, bake_workflow, protected_authority]
  - path: docs/WORLD_AUTHORING_WORKFLOW.md
    domains: [manual_placement, pcg_reservations, artist_workflow]
  - path: docs/M07_DISPOSABLE_VOLUME_RECOVERY_HARNESS.md
    domains: [repository_storage, report_publication, recovery_harness, durability_acceptance]
  - path: docs/MODULAR_BUILD_QUEUE.md
    domains: [narrative_build_history]
  - path: docs/WINDOWS_STEAM.md
    domains: [packaging, multiplayer, hands_on_runtime_checks]

