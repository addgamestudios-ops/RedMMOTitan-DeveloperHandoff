claim_limit: >-
  This record includes static backend-neutral contracts, a project-owned
  in-memory sparse binary-density/material backend, and a logical exact-ticket
  generated-output completion boundary plus a hash-chained journal export and
  checkpoint-persistence acknowledgement boundary with offline source/model
  verification, plus nine development-only native backend automation
  scenarios. The C++ backend and harness are uncompiled and unwired; neither the
  Python model nor source-contract suite executes them.
  No adapter recomputes a fingerprint from an installed artifact, so logical
  readiness mutation is not proof of generated mesh or collision. No external
  adapter writes, flushes, reloads, authenticates, or replays the checkpoint and
  journal data. These records do not deform an actor, move or render a resource
  cluster, mutate Inventory, launch Unreal, render a cavity, validate controls,
  profile performance, package, or test multiplayer.
