authority: server
production_enabled: false

current_boundary:
  state: current_static_mesh_depletion_is_not_mining
  facts:
    - ARedMineableAsteroid stores one scalar OreRemaining and one intact static-mesh presentation
    - zero ore enters whole-actor depletion, destruction, debris, and direct resource-credit behavior
    - no localized material volume, persistent carved cavity, or voxel edit state exists
    - the production field and all protected maps remain outside M12 prototype scope

installed_capability:
  voxel_backend:
    state: third_party_absent_project_owned_source_present_uncompiled
    project_plugin_descriptor_count: 0
    engine_plugin_descriptor_count: 0
    uproject_entry:
      name: Voxel
      enabled: false
    redmmo_runtime_module_dependency: false
    project_owned_backend:
      class: FRedInMemorySparseVoxelBackend
      source:
        - Source/RedMMO/Mining/RedInMemorySparseVoxelBackend.h
        - Source/RedMMO/Mining/RedInMemorySparseVoxelBackend.cpp
      integration: uncompiled_unwired
    latest_runtime_observation: >-
      The accepted 2026-07-23 D3D12 log cannot resolve
      /Script/Voxel.VoxelCollisionInvokerComponent and mounts no Voxel plugin.
  misleading_legacy_name:
    path: Source/RedMMO/RedMMOVoxelLibrary.h
    actual_role: editor-only sky color-curve and atlas authoring helper
    voxel_edit_api_count: 0
    policy: do_not_treat_as_a_voxel_backend
  available_geometry_primitives:
    - GeometryScripting is enabled and its GeometryScriptingCore module is runtime-capable, but RedMMO does not link it
    - ProceduralMeshComponent is installed and already linked by RedMMO
    - built-in Geometry Script exposes mesh voxelization, marching-cubes controls, SDF morphology, and DynamicMesh subtraction that may generate presentation geometry
    - these primitives can render generated geometry but provide no accepted voxel density store, edit journal, replication, persistence, or late-join contract
  planetgen_boundary:
    state: radial_heightfield_not_voxel_volume
    facts:
      - each PlanetGen chunk samples one radial height for each coordinate on a two-dimensional grid
      - the grid is triangulated into one procedural surface section with collision
      - terrain stamps change geodesic radial height and cannot represent caves, overhangs, internal material, or removed volume
      - PlanetGen generation-token stale-result rejection is a reusable pattern for discarding obsolete asynchronous M12 remesh work
  disabled_paths:
    - ARedBolt::SpawnVoxelCraterStamp is an explicit no-op
    - ARedPlayerCharacter::SpawnBolt configures ground impact with voxel carving disabled
    - the historical stamp path was disabled because its preview rendered as accumulating black blobs
    - enabling the old carve flag while its crater function remains empty could create a resource pickup without removing material

reusable_foundation:
  resource_pickup:
    class: ARedResourcePickup
    verified:
      - server authority owns overlap collection and calls AddResource exactly once before destruction
      - resource type, amount, collectible state, and radial up replicate
      - a noncollectible short-lived variant already supports direct-credit receipt presentation
    missing_for_m12:
      - no suction or tractor target
      - no attraction state or travel timing
      - actor movement replication is disabled
      - no line-of-sight, range, ownership, cancellation, or anti-steal policy
  inventory:
    verified:
      - Stone, Iron, and Crystal quantities are absent from the always-on combat HUD
      - the existing Inventory Resources page owns persistent quantity presentation
      - the existing transient receipt can be adapted to report collection completion
    missing_for_m12:
      - durable PlayerState, save, travel, reconnect, restart, and account ownership
      - current resource totals live on the replicated pawn and are session gameplay state rather than a durable MMO ledger
  field_and_network:
    verified:
      - deep-space placement, stable member IDs, bounded relevancy, exactly-once reward, and live-session late-join patterns exist for the static-mesh field
    policy: reuse_patterns_not_production_actors

backend_neutral_contract_foundation:
  state: static_source_verified_uncompiled_unwired
  source:
    - Source/RedMMO/Mining/RedVoxelMiningContracts.h
    - Source/RedMMO/Mining/RedVoxelMiningContracts.cpp
    - Source/RedMMO/Mining/RedVoxelAsteroidBackend.h
  verified_contracts:
    - client envelopes carry no yield or trusted material result
    - immutable volume fields are serialized canonically and their SHA-256 fingerprint is recomputed before admission
    - server edits and atomic backend results bind exact target, sequence, expected revision, prediction token, and authority generation
    - per-collector contiguous request high-water state supports interleaved collectors against one global volume revision
    - accepted yield is derived exactly from removed cells and authoritative cell volume
    - dirty chunks, yield entries, edited cells, checkpoint bytes, and request rates have immutable prototype ceilings
    - whole-volume checkpoints bind stable ID, seed, material table, volume-spec hash, common revision, exact chunk set, allowlisted codec, canonical payload hashes, and aggregate byte ceiling
    - whole-volume restore is compare-and-swap constrained to absent initialization or exact-revision and exact-generation quiesced replacement, with live rollback forbidden
    - role-specific presentation or collision readiness requires the exact content revision, content hash, and advanceable generation token
    - logical loose-resource transitions are monotonic and collection credit requires matching server-observed eligibility, line of sight, arrival distance, timing, reservation, source, collector, and revision evidence
    - future durable credit receives the idempotency tuple ClusterId plus CollectedRevision
  prototype_hard_ceiling:
    volume_cells_per_axis: 64
    chunk_cells_per_axis: 16
    edited_cells_per_request: 2048
    dirty_chunks_per_edit: 8
    yield_entries_per_edit: 4
    loose_clusters_per_edit: 4
    requests_per_second: 8
    checkpoint_chunks: 64
    checkpoint_set_bytes: 16777216
  isolation:
    - no runtime consumer, actor, RPC, Inventory mutation, production field, map, plugin, or build-rule wiring
    - no per-voxel actors, per-voxel RPCs, generated-triangle replication, or client-supplied yield
    - plain C++ authority-domain types are not reflected wire DTOs; any future replicated DTO must be separate and omit server-private reservation proof
  offline_verification:
    focused_authority_contracts: 13_of_13_passed
    combined_capability_and_authority_contracts: 21_of_21_passed

