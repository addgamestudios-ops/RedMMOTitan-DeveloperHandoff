    - the generation comparison precedes the sole live-volume removal and no alternate backend implementation or runtime caller exists
  offline_verification:
    native_automation_source_contracts: 42_of_42_passed
    new_generation_cas_release_source_contracts: 2_of_2_passed
    combined_focused_M12_contracts: 114_of_114_passed
    protected_provenance: 7_of_7_passed
    final_static_regressions_prerecord: 141_of_141_passed
    full_offline_discovery_prerecord: 525_of_525_passed
    full_offline_discovery_postrecord: 525_of_525_passed
    project_knowledge_integrity_prerecord: passed_with_0_findings
  limitations:
    - the ninth native scenario is not compiled or executed and therefore proves no backend runtime behavior
    - release does not prove persistence-safe unload, external durability, recovery, replication, or authentication
    - no adapter, actor, map, deformation, collision cook, suction, Inventory mutation, renderer, Unreal process, package, Steam, multiplayer, or production field was exercised

backend_admission_gate:
  required_before_voxel_implementation:
    - project-local source or approved binary distribution with pinned version and license provenance
    - explicit Unreal Engine 5.8 compatibility
    - runtime density or material read and bounded brush-edit API
    - runtime mesh and collision rebuild support with bounded asynchronous work
    - deterministic base volume or serializable snapshots
    - dedicated-server compatibility and no editor-only dependency
    - no mutation of vendor source; isolate integration behind a project-owned adapter
  rejected_shortcuts:
    - relabeling whole-mesh destruction as mining
    - using decals, Chaos fracture, or DynamicMesh booleans as voxel acceptance
    - spawning one replicated actor or network message per removed voxel
    - crediting Inventory before the visible material reaches the collector
    - enabling the dormant Voxel uproject entry without a descriptor, source, license, and UE 5.8 build proof

smallest_isolated_prototype:
  map_asset_path: /Game/RedMMO/Maps/Tests/RedVoxelAsteroid_M12
  stable_id: asteroid.red.m12.prototype.001
  production_map_or_field_replacement: false
  scale:
    target_diameter_m: [25, 40]
    purpose: bounded walkable one-player test body rather than a planet-scale volume
  initial_density_candidate:
    dimensions_cells: [64, 64, 64]
    cell_size_m: [0.75, 1.0]
    chunk_dimensions_cells: [16, 16, 16]
    status: profiling_candidate_not_accepted_budget
    source_of_truth: authoritative_density_and_material_cells
    generated_outputs:
      - runtime presentation mesh
      - bounded rebuilt collision
  implemented_backend_neutral_types:
    - RedVoxelMining::FClientEditRequest
    - RedVoxelMining::FValidatedEdit
    - RedVoxelMining::FApplyResult
    - RedVoxelMining::FChunkRevision
    - RedVoxelMining::FVolumeCheckpoint
    - RedVoxelMining::FEditOperation
    - RedVoxelMining::FEditJournalExport
    - RedVoxelMining::FCheckpointPersistenceTicket
    - RedVoxelMining::FCheckpointPersistenceRequest
    - RedVoxelMining::FCheckpointPersistenceAcknowledgement
    - RedVoxelMining::FCheckpointRestorePrecondition
    - RedVoxelMining::FLooseClusterState
    - RedVoxelMining::FServerSuctionArrivalEvidence
    - RedVoxelMining::FInventoryCreditCommit
    - IRedVoxelAsteroidBackend
    - FRedInMemorySparseVoxelBackend
  future_runtime_types:
    - serialized compilation and execution of the nine authored native backend scenarios
    - project-owned mesh and collision adapter that recomputes installed-artifact fingerprints
    - trusted versioned checkpoint and journal persistence adapter with replay and restart recovery
    - ARedVoxelAsteroidPrototype
    - ARedLooseResourceCluster
  server_authoritative_flow:
    - player exits the ship and equips a dedicated handheld mining tool
    - client requests a brush edit with target stable ID, origin, direction, and local prediction token
    - server revalidates possession, tool state, range, line of sight, rate limit, target ID, and current revision
    - backend removes only intersected material and returns exact removed volume grouped by material ID
    - server rejects zero-volume and duplicate requests, advances one monotonic edit revision, and appends one bounded brush operation
    - server aggregates removed material into a small number of loose clusters rather than per-voxel actors
    - an eligible cluster acquires the authorized collector only inside bounded range and line of sight
    - server owns suction collection, cancellation, arrival, exactly-once Inventory credit, and cluster destruction
    - Inventory updates only after collection arrival and the combat HUD shows only a transient collection receipt
  replication_and_late_join:
    - replicate immutable stable ID, base seed, material-table ID, dimensions, and monotonic revision
    - replicate validated compact brush operations, never generated triangles or one event per voxel
    - periodically checkpoint dirty chunk density and material state with content hashes
    - late join receives the newest checkpoint plus subsequent ordered edits before collision or mining is enabled
    - clients rebuild visible meshes locally while authority retains canonical volume and gameplay collision
    - stale, duplicate, skipped-revision, wrong-target, and out-of-range edits fail closed
  gravity_and_traversal:
    - register the isolated asteroid through a project-owned stable celestial-body adapter
    - reuse the RedCelestialFrameRegistry stable-frame contract rather than hard-coded actor names
    - do not mutate the home planet, production scenery bodies, or production asteroid field to prove the prototype
  performance_budgets_to_define_before_runtime:
    - voxel size and chunk dimensions
    - maximum edited voxels and dirty chunks per request
    - maximum requests and loose clusters per player per second
    - mesh and collision rebuild milliseconds per frame
    - replication bytes per edit, checkpoint, and late join
    - relevance and cleanup distances

acceptance_sequence:
  - static backend admission and source-contract tests
  - serialized editor and game-target compile
  - one isolated real-GPU walk, carve, persistent-cavity, suction, and Inventory-credit pass
  - authoritative two-player ownership, anti-duplication, competing-collection, and late-join pass
  - bounded GPU, game-thread, collision-cook, server, and network profiling
  - only after isolated acceptance, review a separate migration plan for production deep-space fields

