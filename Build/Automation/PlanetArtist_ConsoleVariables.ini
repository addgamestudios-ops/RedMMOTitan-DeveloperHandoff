[Startup]
; Safe environment-art defaults for 8-12 GB Windows GPUs.  These keep the
; authoring canvas responsive without changing any source assets.  An artist
; can raise viewport scalability after the project has opened successfully.
r.Streaming.LimitPoolSizeToVRAM=1
r.Streaming.PoolSize=1024
r.Streaming.MaxTempMemoryAllowed=32
r.Shadow.Virtual.Enable=0
r.Nanite=0
r.Lumen.DiffuseIndirect.Allow=0
r.Lumen.Reflections.Allow=0
r.VolumetricCloud.ViewRaySampleMaxCount=32
r.VolumetricCloud.Shadow.ViewRaySampleMaxCount=16
r.ScreenPercentage=67
t.MaxFPS=45
